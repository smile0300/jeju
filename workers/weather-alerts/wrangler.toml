name = "jeju-weather-alerts"
main = "src/index.js"
compatibility_date = "2024-03-20"

# 10분마다 실행되도록 크론 설정
[triggers]
crons = ["*/10 * * * *"]

# 중복 발송 방지를 위한 KV 바인딩 (주석을 해제하고 id를 입력하세요)
[[kv_namespaces]]
binding = "WEATHER_KV"
id = "0827eda2b239438aa0583616b205231b"

# 개발 환경 변수 예시 (실제 배포시에는 wrangler secret put 명령어로 설정하는 것을 권장합니다)
# [vars]
# KMA_API_KEY = "기상청_API_키"
# FIREBASE_SERVICE_ACCOUNT = '{"type": "service_account", ... }'
