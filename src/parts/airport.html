<!-- ===== Airport Section ===== -->
<section id="airport" class="app-section">
    <header class="app-bar">
        <button class="back-btn" onclick="showSection('home')">←</button>
        <h2 class="bar-title"><i class="ph-duotone ph-airplane-tilt"></i> <span data-i18n="airport.title">济州国际机场</span></h2>
    </header>
    <div class="section section-alt">
        <div class="container">

            <div class="flight-tabs">
                <button class="flight-tab active" id="tab-arrive" onclick="switchFlightTab('arrive')" data-i18n="airport.arrive">到达航班</button>
                <button class="flight-tab" id="tab-depart" onclick="switchFlightTab('depart')" data-i18n="airport.depart">出发航班</button>
            </div>
            <div id="flight-content-arrive" class="flight-content active">
                <div class="flight-table">
                    <div id="arrive-data"></div>
                </div>
            </div>
            <div id="flight-content-depart" class="flight-content">
                <div class="flight-table">
                    <div id="depart-data"></div>
                </div>
            </div>
        </div>
    </div>
</section>
