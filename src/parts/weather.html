<!-- ===== Weather Section ===== -->
<section id="weather" class="app-section">
    <header class="app-bar">
        <button class="back-btn" onclick="showSection('home')">←</button>
        <h2 class="bar-title"><i class="ph-duotone ph-cloud-sun"></i> <span data-i18n="weather.title">天气预报</span></h2>
    </header>
    <!-- SEO: /weather 페이지 전용 h1 (구글봇 인식용, 화면 비노출) -->
    <h1 class="visually-hidden">Jeju Island Real-Time Weather Forecast — Hourly &amp; Weekly | 济州岛实时天气预报 제주도 날씨</h1>
    <div class="section section-alt">
        <div class="container">
            
            <!-- ① 기상특보 배너 (조건부 최상단 — JS가 특보 없을 때 숨김 처리) -->
            <div id="weather-alerts-container" class="weather-alerts-top-banner" style="display: none;">
                <div class="weather-alert-card no-alerts">
                    <div class="alert-msg" data-i18n="weather.alert.checking">正在检查气象特报...</div>
                </div>
            </div>

            <!-- ② 지역 선택 (드롭다운 방식) -->
            <div class="weather-nav-wrapper" id="weather-nav-wrapper">

                <!-- 접힌 상태: 현재 선택된 지역 버튼 -->
                <div class="loc-trigger-row">
                    <button class="loc-selected-btn" id="loc-selected-btn" onclick="window.toggleLocationGrid()">
                        <i class="ph-duotone ph-map-pin"></i>
                        <span id="loc-selected-label" data-i18n="weather.loc.jeju">济州市</span>
                        <i class="ph ph-caret-down loc-caret" id="loc-caret"></i>
                    </button>
                    <button id="global-summary-btn" class="header-summary-btn" onclick="window.openWeatherSummaryModal()" style="margin-left: auto;"><i class="ph-duotone ph-chart-bar"></i> <span data-i18n="weather.summary">简略查看</span></button>
                </div>

                <!-- 펼쳐진 상태: 전체 그리드 (기본 숨김) -->
                <div class="location-grid-panel" id="location-grid-panel">
                    <div class="location-tabs" id="location-tabs">
                        <!-- Row 1: North + South + West (5 items) -->
                        <div class="loc-row">
                            <div class="loc-group-wrapper group-north">
                                <span class="group-label" data-i18n="weather.group.north">北线</span>
                                <button class="location-tab active" data-loc="jeju" onclick="switchWeatherLocation('jeju')">
                                    <span class="tab-name" data-i18n="weather.loc.jeju">济州市</span>
                                </button>
                            </div>
                            <div class="loc-group-wrapper group-south">
                                <span class="group-label" data-i18n="weather.group.south">南线</span>
                                <button class="location-tab" data-loc="seogwipo" onclick="switchWeatherLocation('seogwipo')">
                                    <span class="tab-name" data-i18n="weather.loc.seogwipo">西归浦</span>
                                </button>
                            </div>
                            <div class="loc-group-wrapper group-west">
                                <span class="group-label" data-i18n="weather.group.west">西线</span>
                                <button class="location-tab" data-loc="aewol" onclick="switchWeatherLocation('aewol')">
                                    <span class="tab-name" data-i18n="weather.loc.aewol">涯月</span>
                                </button>
                                <button class="location-tab" data-loc="hyeopjae" onclick="switchWeatherLocation('hyeopjae')">
                                    <span class="tab-name" data-i18n="weather.loc.hyeopjae">挟才</span>
                                </button>
                                <button class="location-tab" data-loc="sanbangsan" onclick="switchWeatherLocation('sanbangsan')">
                                    <span class="tab-name" data-i18n="weather.loc.sanbangsan">山房山</span>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Row 2: East + Hallasan (5 items) -->
                        <div class="loc-row">
                            <div class="loc-group-wrapper group-east">
                                <span class="group-label" data-i18n="weather.group.east">东线</span>
                                <button class="location-tab" data-loc="hamdeok" onclick="switchWeatherLocation('hamdeok')">
                                    <span class="tab-name" data-i18n="weather.loc.hamdeok">咸德</span>
                                </button>
                                <button class="location-tab" data-loc="woljeong" onclick="switchWeatherLocation('woljeong')">
                                    <span class="tab-name" data-i18n="weather.loc.woljeong">月汀</span>
                                </button>
                                <button class="location-tab" data-loc="seongsan" onclick="switchWeatherLocation('seongsan')">
                                    <span class="tab-name" data-i18n="weather.loc.seongsan">日出峰</span>
                                </button>
                                <button class="location-tab" data-loc="udo" onclick="switchWeatherLocation('udo')">
                                    <span class="tab-name" data-i18n="weather.loc.udo">牛岛</span>
                                </button>
                            </div>
                            <div class="loc-group-wrapper group-mountain">
                                <span class="group-label" data-i18n="weather.group.mountain">山岳</span>
                                <button class="location-tab" data-loc="hallasan" onclick="switchWeatherLocation('hallasan')">
                                    <span class="tab-name" data-i18n="weather.loc.hallasan">汉拿山</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- ③ 실시간/과거 탭 (지역 선택 이후) -->
            <div class="weather-view-tabs">
                <button class="view-tab active" data-view="current" onclick="switchWeatherView('current')">
                    <span data-i18n="weather.view.current">실시간 날씨</span>
                </button>
                <button class="view-tab" data-view="past" onclick="switchWeatherView('past')">
                    <span data-i18n="weather.view.past">과거 날씨</span>
                </button>
            </div>

            <!-- Current Weather View (Default) -->
            <div id="weather-current-view" class="weather-view-container active">

            <!-- Weather Content Area -->
            <div class="weather-content-wrapper">
                <!-- Jeju -->
                <div id="weather-content-jeju" class="location-weather active">

                    <div class="naver-card current-compare-card" id="current-card-jeju">
                        <div class="weather-loader"><i class="ph-duotone ph-circle-notch spin" style="font-size: 3rem; color: var(--accent-blue); margin-bottom: 15px;"></i><div class="weather-loading-text" data-i18n="weather.loading">正在加载...</div></div>
                    </div>
                    <div class="weather-details-bar" id="details-bar-jeju"></div>
                    <div class="naver-card hourly-forecast-card">
                        <div class="hourly-table-container" id="hourly-table-jeju"></div>
                    </div>
                    <div class="naver-card weekly-forecast-card">
                        <div class="weekly-list-container" id="weekly-list-jeju"></div>
                    </div>
                    <div id="air-quality-jeju" class="air-quality-grid"></div>
                </div>

                        <div class="weather-loader"><i class="ph-duotone ph-circle-notch spin" style="font-size: 3rem; color: var(--accent-blue); margin-bottom: 15px;"></i><div class="weather-loading-text" data-i18n="weather.loading">正在加载...</div></div>
                    </div>
                    <div class="weather-details-bar" id="details-bar-sanbangsan"></div>

            </div> <!-- End weather-content-wrapper -->
            </div> <!-- End weather-current-view -->

            <!-- Past Weather View (Mockup) -->
            <div id="weather-past-view" class="weather-view-container" style="display: none;">
                <!-- Summary Card -->
                <div class="past-weather-summary naver-card">
                    <div class="pws-header">

                        <div class="pws-filters">
                            <select class="pws-select" id="pws-year-select"></select>
                            <select class="pws-select" id="pws-month-select"></select>
                        </div>
                    </div>
                    <div class="pws-stats-row-top">
                        <div class="pws-stat-item">
                            <span class="pws-stat-label" data-i18n="weather.past.avg_temp">평균 기온</span>
                            <span class="pws-stat-val" id="pws-avg-temp">--°C</span>
                        </div>
                        <div class="pws-stat-item">
                            <span class="pws-stat-label" data-i18n="weather.past.score">날씨 점수</span>
                            <span class="pws-stat-val" id="pws-weather-score">
                                <i class="ph ph-star color-star"></i><i class="ph ph-star color-star"></i><i class="ph ph-star color-star"></i><i class="ph ph-star color-star"></i><i class="ph ph-star color-star"></i>
                            </span>
                        </div>
                    </div>
                    <div class="pws-stats-row-bottom">
                        <div class="pws-stat-item">
                            <span class="pws-stat-label" data-i18n="weather.past.rain_days">비 온 날</span>
                            <span class="pws-stat-val p-blue" id="pws-rain-days">--</span>
                        </div>
                        <div class="pws-stat-item">
                            <span class="pws-stat-label" data-i18n="weather.past.cloudy_days">흐린 날</span>
                            <span class="pws-stat-val p-gray" id="pws-cloudy-days">--</span>
                        </div>
                        <div class="pws-stat-item">
                            <span class="pws-stat-label" data-i18n="weather.past.clear_days">맑은 날</span>
                            <span class="pws-stat-val p-orange" id="pws-clear-days">--</span>
                        </div>
                    </div>
                    <div class="pws-tip-box" id="pws-tip-box">
                        <i class="ph-duotone ph-t-shirt color-primary"></i>
                        <span id="pws-tip-text" data-i18n="weather.past.tip.loading"><strong>옷차림 팁:</strong> 데이터를 불러오는 중입니다.</span>
                    </div>
                </div>

                <!-- Calendar Grid Mockup -->
                <div class="past-weather-calendar naver-card">
                    <div class="pwc-days-header">
                        <div class="pwc-day-name p-red" data-i18n="weather.past.sun">일</div>
                        <div class="pwc-day-name" data-i18n="weather.past.mon">월</div>
                        <div class="pwc-day-name" data-i18n="weather.past.tue">화</div>
                        <div class="pwc-day-name" data-i18n="weather.past.wed">수</div>
                        <div class="pwc-day-name" data-i18n="weather.past.thu">목</div>
                        <div class="pwc-day-name" data-i18n="weather.past.fri">금</div>
                        <div class="pwc-day-name p-blue" data-i18n="weather.past.sat">토</div>
                    </div>
                    <div class="pwc-grid" id="pwc-grid-container">
                        <!-- JS dynamically injects cells here -->
                    </div>
                </div>

            <!-- SEO Content Description -->
