<!-- ===== Home Section ===== -->
<section id="home" class="app-section active">
    <div class="home-screen">
        <!-- 언어 선택기 (우측 상단) -->
        <div class="lang-selector">
            <button class="lang-btn active" data-lang="zh" onclick="setLanguage('zh')">CN</button>
            <button class="lang-btn" data-lang="ko" onclick="setLanguage('ko')">KR</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        </div>

        <div class="home-welcome">
            <h1 class="main-logo">JEJU LIVE</h1>
        </div>
        <!-- Home Weather Alert Banner -->
        <div id="home-alerts-container" class="weather-alerts-container" style="display: none; padding: 0 20px; margin-bottom: 20px;"></div>

        <div class="home-grid">
            <button class="home-item item-disabled" disabled type="button">
                <span class="item-icon"><i class="ph-duotone ph-webcam color-cctv"></i></span>
                <span class="item-label" data-i18n="nav.cctv">实时监控</span>
                <span class="coming-soon-badge" style="background-color: #f59e0b; color: white;" data-i18n="badge.maintenance">维护中</span>
            </button>
            <button class="home-item item-weather" onclick="showSection('weather')" type="button">
                <span class="item-icon"><i class="ph-duotone ph-cloud-sun color-gnb"></i></span>
                <span class="item-label" data-i18n="nav.weather">天气预报</span>
            </button>
            <button class="home-item item-hallasan" onclick="showSection('hallasan')" type="button">
                <span class="item-icon"><i class="ph-duotone ph-mountains color-gnb"></i></span>
                <span class="item-label" data-i18n="nav.hallasan">汉拿山</span>
            </button>
            <button class="home-item item-airport" onclick="showSection('airport')" type="button">
                <span class="item-icon"><i class="ph-duotone ph-airplane-tilt color-airport"></i></span>
                <span class="item-label" data-i18n="nav.airport">机场信息</span>
            </button>
            <button class="home-item item-lost" onclick="showSection('lost-found')" type="button">
                <span class="item-icon"><i class="ph-duotone ph-magnifying-glass color-gnb"></i></span>
                <span class="item-label" data-i18n="nav.lost">失物招领</span>
            </button>
            <button class="home-item item-festival" onclick="showSection('festival')" type="button">
                <span class="item-icon"><i class="ph-duotone ph-confetti color-gnb"></i></span>
                <span class="item-label" data-i18n="nav.festival">节日活动</span>
            </button>
            <button class="home-item item-reward" onclick="showSection('reward')" type="button">
                <span class="item-icon"><i class="ph-duotone ph-piggy-bank color-gnb"></i></span>
                <span class="item-label" data-i18n="nav.reward">赏金任务</span>
            </button>
            <!-- 맛집 & 여행 코스 준비 중 -->
            <button class="home-item item-disabled" disabled type="button">
                <span class="item-icon"><i class="ph-duotone ph-hamburger color-gnb"></i></span>
                <span class="item-label" data-i18n="nav.food">济州美食</span>
                <span class="coming-soon-badge">SOON</span>
            </button>
            <button class="home-item item-disabled" disabled type="button">
                <span class="item-icon"><i class="ph-duotone ph-map-trifold color-gnb"></i></span>
                <span class="item-label" data-i18n="nav.course">推荐路线</span>
                <span class="coming-soon-badge">SOON</span>
            </button>
        </div>
    </div>
</section>
