<!-- ===== Hallasan Section ===== -->
<section id="hallasan" class="app-section">
    <header class="app-bar">
        <button class="back-btn" onclick="goBack('home')">←</button>
        <h2 class="bar-title"><i class="ph-duotone ph-mountains"></i> <span data-i18n="hallasan.title">汉拿山登山信息</span></h2>
    </header>
    <!-- SEO: /hallasan 페이지 전용 h1 (구글봇 인식용, 화면 비노출) -->
    <h1 class="visually-hidden">Hallasan Mountain Trail Status Today — Open, Closed, Restricted | 汉拿山登山实时通行状态 한라산 등산 통제 현황</h1>
    <div class="section hallasan-section-wrap">
        <div class="container">
            <!-- 한라산 / 오름 탭 (oreum.js가 전환 처리) -->
            <div class="flight-tabs hallasan-tabs" role="tablist">
                <button type="button" class="flight-tab active" role="tab" aria-selected="true" data-hallasan-tab="mountain" onclick="window.oreumApp && window.oreumApp.switchTab('mountain')">
                    <i class="ph-duotone ph-mountains"></i>&nbsp;<span data-i18n="hallasan.tab.mountain">汉拿山</span>
                </button>
                <button type="button" class="flight-tab" role="tab" aria-selected="false" data-hallasan-tab="oreum" onclick="window.oreumApp && window.oreumApp.switchTab('oreum')">
                    <i class="ph-duotone ph-tree-evergreen"></i>&nbsp;<span data-i18n="hallasan.tab.oreum">火山丘 Oreum</span>
                </button>
            </div>

            <div id="hallasan-pane-oreum" class="oreum-pane" hidden></div>

            <div id="hallasan-pane-mountain">
            <!-- [NEW] 한라산 히어로 통제 현황 섹션 (Hero Status Section) -->
            <div id="hallasan-hero-status" class="hero-status-wrapper">
                <div id="hallasan-status-container">
                    <!-- JS에서 히어로 카드가 주입됩니다. -->
                </div>
            </div>


            <!-- 기상특보·한라산 통제 알림 받기 (아직 묻지 않은 웹 브라우저에서만 표시, main.js updatePushOptin) -->
            <button type="button" class="push-optin-btn" style="display:none;" onclick="window.requestAlertPush()">
                <i class="ph-duotone ph-bell-ringing"></i> <span data-i18n="push.optin">接收气象预警·汉拿山管制通知</span>
            </button>

            <div class="trails-grid" id="trails-grid"></div>

            <!-- 한라산 예약 및 공지사항 버튼 -->
            <div class="action-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0;">
                <button class="hallasan-action-btn btn-sm" onclick="window.open('https://visithalla.jeju.go.kr/main/main.do?language=' + ({ ko: 'ko_KR', en: 'en_US' }[window.getLang && window.getLang()] || 'zh_CN'), '_blank')">
                    <i class="ph-duotone ph-calendar-check" style="font-size: 1.1rem;"></i> <span data-i18n="hallasan.reserve">한라산 예약</span>
                </button>
                <button class="hallasan-action-btn btn-sm" onclick="window.open('https://www.jeju.go.kr/hallasan/notice/notice.htm', '_blank')">
                    <i class="ph-duotone ph-megaphone" style="font-size: 1.1rem;"></i> <span data-i18n="hallasan.notice">한라산 공지사항</span>
                </button>
            </div>

            <div id="hallasan-cctv-container">
                <div class="cctv-grid" id="hallasan-cctv-grid">
                    <!-- CCTV 카드가 이곳에 동적으로 주입됩니다. -->
                </div>
            </div>

            <!-- SEO Content Description -->
            <div class="seo-content-desc" data-i18n="seo.desc.hallasan">汉拿山登山路线实时通行状态及管制信息</div>
            </div><!-- /#hallasan-pane-mountain -->
        </div>
    </div>
</section>
