<!-- ===== Course Section ===== -->
<section id="course" class="app-section">
    <header class="app-bar">
        <button class="back-btn" onclick="showSection('home')">←</button>
        <h2 class="bar-title"><i class="ph-duotone ph-map-trifold"></i> <span data-i18n="nav.course">推荐路线</span></h2>
    </header>
    <div class="section">
        <div class="container">
            <div class="res-notice-card">
                <i class="ph-duotone ph-map-trifold" style="font-size:1.4rem; color:var(--color-course);"></i>
                <p data-i18n="course.form.notice">填写您的旅行偏好，我们将通过微信为您定制专属行程 📩</p>
            </div>
            <form id="course-form" class="reservation-form" onsubmit="event.preventDefault(); window.submitReservation('course');">
                <div class="form-group">
                    <label class="form-label required" data-i18n="res.wechat.label">微信ID</label>
                    <input type="text" id="course-wechat" class="form-input" data-i18n-placeholder="res.wechat.placeholder" placeholder="请输入您的微信ID" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label required" data-i18n="course.form.theme">旅行主题/偏好</label>
                    <input type="text" id="course-store" class="form-input" data-i18n-placeholder="course.form.theme_ph" placeholder="例如：家庭游，网红打卡，休闲度假等" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label required" data-i18n="course.form.date">旅行日期</label>
                    <input type="text" id="course-visit-date" class="date-input form-input" data-i18n-placeholder="res.date.placeholder" placeholder="请选择日期" readonly required>
                </div>
                <div class="form-group">
                    <label class="form-label required" data-i18n="res.party.label">人数</label>
                    <div class="res-party-row">
                        <button type="button" class="party-btn" onclick="window.adjustParty(-1, 'course')">−</button>
                        <input type="number" id="course-party" class="form-input party-input" value="2" min="1" max="20" readonly>
                        <button type="button" class="party-btn" onclick="window.adjustParty(1, 'course')">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="res.note.label">备注事项</label>
                    <textarea id="course-note" class="form-input form-textarea" data-i18n-placeholder="res.note.placeholder" placeholder="如有特殊要求请在此说明" rows="4"></textarea>
                </div>
                <div id="course-status" class="form-status" style="display:none;"></div>
                <button type="submit" id="course-submit-btn" class="res-submit-btn">
                    <i class="ph-duotone ph-paper-plane-tilt"></i>
                    <span data-i18n="res.submit">提交申请</span>
                </button>
            </form>
        </div>
    </div>
</section>
