<!-- ===== Festival Section ===== -->
<section id="festival" class="app-section">
    <header class="app-bar">
        <button class="back-btn" onclick="showSection('home')">←</button>
        <h2 class="bar-title"><i class="ph-duotone ph-confetti"></i> <span data-i18n="festival.title">济州精彩活动</span></h2>
    </header>
    <!-- SEO: /festival 페이지 전용 h1 (구글봇 인식용, 화면 비노출) -->
    <h1 class="visually-hidden">Jeju Island Festivals &amp; Events 2026 — Current &amp; Upcoming | 济州岛节庆活动 제주 축제 행사</h1>
    <div class="section">
        <div class="container">
            <!-- 날짜 검색 필터 추가 -->
            <div class="festival-filter-container search-filter-box" style="margin-top: 10px; margin-bottom: 15px;">
                <div class="filter-row" style="display:flex;gap:10px;align-items:center;">
                    <input type="date" id="festival-date-start" class="date-input" style="flex:1;" onchange="window.festivalApp.handleDateChange()">
                    <span>~</span>
                    <input type="date" id="festival-date-end" class="date-input" style="flex:1;" onchange="window.festivalApp.handleDateChange()">
                    <button class="search-btn" onclick="window.festivalApp.handleDateChange()">
                        <i class="ph-duotone ph-list-magnifying-glass" style="color: white;"></i>
                    </button>
                </div>
            </div>

            <!-- 월별 축제 필터 (v5.0) -->
            <div class="festival-month-filter" id="month-filter">
                <!-- script.js에서 동적으로 생성됩니다 -->
            </div>

            <div id="festival-result-count" class="lost-result-count" style="margin: 10px 0;"></div>


            <div id="festival-list" class="festival-list"></div>

            <!-- SEO Content Description -->
            <div class="seo-content-desc" data-i18n="seo.desc.festival">济州岛近期节庆活动日历</div>
        </div>
    </div>
</section>
