<!-- ===== Festival Section ===== -->
<section id="festival" class="app-section">
    <header class="app-bar">
        <button class="back-btn" onclick="showSection('home')">←</button>
        <h2 class="bar-title"><i class="ph-duotone ph-confetti"></i> <span data-i18n="festival.title">济州精彩活动</span></h2>
    </header>
    <!-- SEO: /festival 페이지 전용 h1 (구글봇 인식용, 화면 비노출) -->
    <h1 class="visually-hidden">Jeju Island Festivals &amp; Events 2026 — Current &amp; Upcoming | 济州岛节庆活动 제주 축제 행사</h1>
    <div class="section">
        <div class="container">
            <!-- 검색 필터 통합 컨테이너 -->
            <div class="festival-filter-container search-filter-box" style="margin-top: 10px; margin-bottom: 20px; padding: 20px;">
                <!-- 날짜 범위 선택 -->
                <div class="filter-row" style="display:flex; gap:10px; align-items:center;">
                    <input type="text" id="festival-date-range" class="date-input" style="flex:1; text-align: center; font-size: 0.95em; cursor: pointer;" placeholder="기간 선택" data-i18n="festival.date_range" readonly>
                    <input type="hidden" id="festival-date-start">
                    <input type="hidden" id="festival-date-end">
                    <button class="search-btn" onclick="window.festivalApp.handleDateChange()">
                        <i class="ph-duotone ph-list-magnifying-glass" style="color: white;"></i>
                    </button>
                </div>
                
                <!-- 3탭 IA 구조 -->
                <div class="festival-tabs" style="display:flex; gap: 8px; margin-top: 15px; border-bottom: 2px solid #f1f3f5; padding-bottom: 5px;">
                    <button class="ftab-btn active" data-tab="recent" onclick="window.festivalApp.switchTab('recent')" style="background:none; border:none; padding: 5px 10px; font-weight:700; color:#495057; border-bottom:3px solid transparent; cursor:pointer;" data-i18n="festival.tab.recent">오늘/이번주</button>
                    <button class="ftab-btn" data-tab="highlight" onclick="window.festivalApp.switchTab('highlight')" style="background:none; border:none; padding: 5px 10px; font-weight:700; color:#495057; border-bottom:3px solid transparent; cursor:pointer;" data-i18n="festival.tab.highlight">시즌 하이라이트</button>
                    <button class="ftab-btn" data-tab="permanent" onclick="window.festivalApp.switchTab('permanent')" style="background:none; border:none; padding: 5px 10px; font-weight:700; color:#495057; border-bottom:3px solid transparent; cursor:pointer;" data-i18n="festival.tab.permanent">상설 전시</button>
                </div>

                <!-- 지역 필터 -->
                <div class="festival-region-filter" style="display:flex; gap:6px; margin-top: 15px; flex-wrap: wrap;">
                    <button class="fregion-btn active" data-region="all" onclick="window.festivalApp.filterRegion('all')" style="padding: 4px 12px; border-radius: 20px; border:1px solid #dee2e6; background:#fff; font-size:0.85rem; color:#495057; cursor:pointer;" data-i18n="festival.region.all">전체</button>
                    <button class="fregion-btn" data-region="jeju" onclick="window.festivalApp.filterRegion('jeju')" style="padding: 4px 12px; border-radius: 20px; border:1px solid #dee2e6; background:#fff; font-size:0.85rem; color:#495057; cursor:pointer;" data-i18n="festival.region.jeju">제주시</button>
                    <button class="fregion-btn" data-region="seogwipo" onclick="window.festivalApp.filterRegion('seogwipo')" style="padding: 4px 12px; border-radius: 20px; border:1px solid #dee2e6; background:#fff; font-size:0.85rem; color:#495057; cursor:pointer;" data-i18n="festival.region.seogwipo">서귀포시</button>
                    <button class="fregion-btn" data-region="east" onclick="window.festivalApp.filterRegion('east')" style="padding: 4px 12px; border-radius: 20px; border:1px solid #dee2e6; background:#fff; font-size:0.85rem; color:#495057; cursor:pointer;" data-i18n="festival.region.east">동부</button>
                    <button class="fregion-btn" data-region="west" onclick="window.festivalApp.filterRegion('west')" style="padding: 4px 12px; border-radius: 20px; border:1px solid #dee2e6; background:#fff; font-size:0.85rem; color:#495057; cursor:pointer;" data-i18n="festival.region.west">서부</button>
                </div>
            </div>

            <style>
                #festival-result-count { font-size: 1.05rem; font-weight: 500; }
                #festival-result-count .highlight { color: #0076ff; font-weight: 700; }
            </style>
            <div id="festival-result-count" class="lost-result-count" style="margin: 10px 0;"></div>


            <div id="festival-list" class="festival-list"></div>

            <!-- SEO Content Description -->
            <div class="seo-content-desc" data-i18n="seo.desc.festival">济州岛近期节庆活动日历</div>
        </div>
    </div>
</section>
