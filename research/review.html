<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 후보지 선별</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1b1f24; --sub:#6b7480; --acc:#2f6bff; --ok:#1f8a4c; --no:#d1383d; --hold:#e08a00; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1d2126; --line:#2c3138; --text:#e8eaed; --sub:#98a1ac; } }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); }
header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 12px 8px; }
h1 { margin:0 0 6px; font-size:1.05rem; }
.stat { font-size:.8rem; color:var(--sub); margin-bottom:6px; }
.stat b { color:var(--text); }
.row { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; }
.chip { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:5px 11px; font-size:.82rem; cursor:pointer; }
.chip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
input[type=search] { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font-size:.95rem; }
main { padding:10px 12px 80px; max-width:900px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin:0 0 10px; }
.card.ok { border-color:var(--ok); } .card.no { opacity:.55; } .card.hold { border-color:var(--hold); }
.top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.name { font-weight:800; font-size:1.02rem; }
.meta { color:var(--sub); font-size:.8rem; margin-top:1px; }
.badges { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 2px; }
.b { font-size:.72rem; padding:2px 7px; border-radius:6px; background:var(--line); }
.b.warn { background:#fde8e8; color:#b3261e; } .b.rain { background:#e2efff; color:#1b5fd1; } .b.photo { background:#efe6ff; color:#6b3bc4; } .b.res { background:#fff1d6; color:#9a5b00; }
@media (prefers-color-scheme: dark) { .b.warn{background:#4a2020;color:#ffb4ab} .b.rain{background:#1d3350;color:#9ec5ff} .b.photo{background:#33284d;color:#cdb8ff} .b.res{background:#4a3a14;color:#ffd58a} }
.kv { font-size:.84rem; margin:3px 0; } .kv span { color:var(--sub); }
.why { font-size:.88rem; margin:6px 0 2px; }
.concern { font-size:.82rem; color:var(--sub); }
.acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.act { flex:1; min-width:64px; padding:8px 4px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:.85rem; cursor:pointer; }
.act.ok.on { background:var(--ok); color:#fff; border-color:var(--ok); } .act.hold.on { background:var(--hold); color:#fff; border-color:var(--hold); } .act.no.on { background:var(--no); color:#fff; border-color:var(--no); }
a.link { font-size:.8rem; color:var(--acc); text-decoration:none; align-self:center; }
.tools { position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--line); padding:8px 12px; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.tools button { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:.82rem; cursor:pointer; }
.empty { text-align:center; color:var(--sub); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>제주 후보지 선별</h1>
  <div class="stat" id="stat"></div>
  <input type="search" id="q" placeholder="이름·주소·세부유형 검색">
  <div class="row" id="fRegion"></div>
  <div class="row" id="fCat"></div>
  <div class="row" id="fSize"></div>
  <div class="row" id="fDec"></div>
  <div class="row" id="fTog"></div>
</header>
<main id="list"></main>
<div class="tools">
  <button id="btnCsv">채택 목록 CSV 내려받기</button>
  <button id="btnBackup">결정 백업</button>
  <button id="btnRestore">결정 불러오기</button>
  <input type="file" id="fileRestore" accept=".json" hidden>
</div>

}

  chips(document.getElementById('fRegion'), [['', '전체 지역'], ...Object.entries(REGION_KO)], 'region');
  chips(document.getElementById('fCat'), [['', '전체 분류'], ...CATS.map(c => [c, c])], 'cat');
  chips(document.getElementById('fSize'), [['', '전체 규모'], ...Object.entries(SIZE_KO)], 'size');
  chips(document.getElementById('fDec'), [['', '전체 상태'], ['none', '미정'], ['ok', '채택'], ['hold', '보류'], ['no', '제외']], 'dec');
  toggles();
}
function visible() {
  const q = f.q.trim().toLowerCase();
  return DATA.filter(r => {
    const d = decisions[r.id] || 'none';
    if (f.region && r['지역'] !== f.region) return false;
    if (f.cat && r['분류'] !== f.cat) return false;
    if (f.size && r['규모'] !== f.size) return false;
    if (f.dec && d !== f.dec) return false;
    if (f.hideNo && d === 'no' && f.dec !== 'no') return false;
    if (f.rain && !(r['우천전용'] === 'Y' || r['우천가능'] === 'Y')) return false;
    if (f.photo && !r['사진포인트']) return false;
    if (f.res && r['예약필요'] !== 'Y') return false;
    if (f.flag && !r['플래그']) return false;
    if (q && !(r['이름_ko'] + r['주소_ko'] + r['세부유형'] + r['선정근거']).toLowerCase().includes(q)) return false;
    return true;
  });
}
function card(r) {
  const d = decisions[r.id] || '';
  const b = [];
  b.push(`<span class="b">${esc(REGION_KO[r['지역']] || r['지역'])}</span>`, `<span class="b">${esc(r['분류'])}</span>`, `<span class="b">${esc(SIZE_KO[r['규모']] || r['규모'])}</span>`);
  if (r['세부유형']) b.push(`<span class="b">${esc(r['세부유형'])}</span>`);
  if (r['우천전용'] === 'Y' || r['우천가능'] === 'Y') b.push('<span class="b rain">비 와도 OK</span>');
  if (r['사진포인트']) b.push('<span class="b photo">사진 명소</span>');
  if (r['예약필요'] === 'Y') b.push('<span class="b res">예약 필요</span>');
  (r['플래그'] ? r['플래그'].split(' / ') : []).forEach(x => b.push(`<span class="b warn">${esc(x)}</span>`));
  const link = r['출처링크'] ? `<a class="link" href="${esc(r['출처링크'])}" target="_blank" rel="noopener">네이버에서 보기 ↗</a>` : '';
  return `<div class="card ${d}" data-id="${esc(r.id)}">
    <div class="top"><div><div class="name">${esc(r['이름_ko'])}</div><div class="meta">${esc(r['주소_ko'])}</div></div>${link}</div>
    <div class="badges">${b.join('')}</div>
    <div class="kv"><span>리뷰</span> ${esc(r['네이버리뷰수'])}건 · <span>대기</span> ${esc(r['대기시간'])} · <span>외국인 직접 예약</span> ${esc(r['외국인직접예약'])}${r['예약수단'] ? ` · <span>예약</span> ${esc(r['예약수단'])}` : ''}</div>
    ${r['사진포인트'] ? `<div class="kv"><span>사진</span> ${esc(r['사진포인트'])}</div>` : ''}
    <div class="why">${esc(r['선정근거'])}</div>
    ${r['우려사항'] ? `<div class="concern">⚠ ${esc(r['우려사항'])}</div>` : ''}
    <div class="acts">
      <button class="act ok ${d === 'ok' ? 'on' : ''}" data-d="ok">✔ 채택</button>
      <button class="act hold ${d === 'hold' ? 'on' : ''}" data-d="hold">? 보류</button>
      <button class="act no ${d === 'no' ? 'on' : ''}" data-d="no">✖ 제외</button>
    </div></div>`;
}
function render() {
  const list = visible();
  document.getElementById('list').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">조건에 맞는 곳이 없습니다</div>';
  const cnt = { ok: 0, hold: 0, no: 0 };
  DATA.forEach(r => { const d = decisions[r.id]; if (cnt[d] !== undefined) cnt[d]++; });
  document.getElementById('stat').innerHTML = `전체 <b>${DATA.length}</b> · 채택 <b>${cnt.ok}</b> · 보류 <b>${cnt.hold}</b> · 제외 <b>${cnt.no}</b> · 미정 <b>${DATA.length - cnt.ok - cnt.hold - cnt.no}</b> · 지금 보이는 곳 <b>${list.length}</b>`;
}
document.addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (c) {
    if (c.dataset.k) { f[c.dataset.k] = (f[c.dataset.k] === c.dataset.v && c.dataset.v) ? '' : c.dataset.v; }
    if (c.dataset.t) f[c.dataset.t] = !f[c.dataset.t];
    filters(); render(); return;
  }
  const a = e.target.closest('.act');
  if (a) {
    const id = a.closest('.card').dataset.id;
    decisions[id] = decisions[id] === a.dataset.d ? '' : a.dataset.d;
    if (!decisions[id]) delete decisions[id];
    save(); render();
  }
});
document.getElementById('q').addEventListener('input', (e) => { f.q = e.target.value; render(); });

const csvCell = (v) => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('btnCsv').onclick = () => {
  const cols = ['이름_ko', '지역', '분류', '세부유형', '주소_ko', '네이버리뷰수', '예약필요', '예약수단', '외국인직접예약', '대기시간', '중국어후기', '사진포인트', '우천가능', '우천전용', '규모', '선정근거', '우려사항', '출처링크', '플래그'];
  const ok = DATA.filter(r => decisions[r.id] === 'ok');
  if (!ok.length) { alert('채택한 곳이 없습니다.'); return; }
  download('approved_all.csv', '﻿' + [cols.join(',')].concat(ok.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\n'), 'text/csv');
};
document.getElementById('btnBackup').onclick = () => download('review_decisions.json', JSON.stringify(decisions, null, 1), 'application/json');
document.getElementById('btnRestore').onclick = () => document.getElementById('fileRestore').click();
document.getElementById('fileRestore').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try { decisions = JSON.parse(await file.text()); save(); render(); } catch (err) { alert('파일을 읽지 못했습니다.'); }
};
filters(); render();
</script>
</body>
</html>
