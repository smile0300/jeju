<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>제주라이브 관리자</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2430; --muted:#6b7684; --line:#dde2e8; --accent:#07c160; --warn:#b54708; --warn-bg:#fff4e5; --info-bg:#eef4ff; --info:#2e5aac; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161b; --card:#1c222a; --text:#e6eaef; --muted:#9aa4b0; --line:#2e3640; --warn:#fdb022; --warn-bg:#2d2310; --info-bg:#18243a; --info:#8fb3ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 12px; }
  h1 { font-size:20px; margin:0; }
  header a { font-size:14px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, textarea, select { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  textarea { resize:vertical; min-height:60px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; min-width:0; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:11px 14px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  button.sub { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:500; padding:7px 12px; font-size:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; background:var(--card); color:var(--text); border:1px solid var(--line); padding:11px 4px; font-size:15px; white-space:nowrap; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .toolbar { display:flex; gap:8px; margin-bottom:8px; }
  .toolbar input { flex:2; }
  .toolbar select { flex:1; }
  .count { font-size:13px; color:var(--muted); margin:0 2px 10px; display:flex; justify-content:space-between; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); margin:0 4px 4px 0; }
  .badge.strong { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .badge.warn { background:var(--warn-bg); border-color:var(--warn); color:var(--warn); font-weight:600; }
  .badge.info { background:var(--info-bg); border-color:var(--info); color:var(--info); font-weight:600; }
  .item-head { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .time { font-size:12px; color:var(--muted); white-space:nowrap; }
  .title { font-weight:600; margin:2px 0 6px; word-break:break-word; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:6px 0 0; font-size:14px; }
  dt { color:var(--muted); white-space:nowrap; }
  dd { margin:0; word-break:break-word; white-space:pre-wrap; }
  .ko { background:var(--info-bg); color:var(--info); border-radius:8px; padding:8px 10px; font-size:14px; margin-top:8px; white-space:pre-wrap; word-break:break-word; }
  .photo { display:block; margin-top:10px; color:var(--info); font-size:14px; }
  .photo img { max-width:100%; max-height:240px; border-radius:8px; border:1px solid var(--line); background:var(--bg); }
  .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .actions a { font-size:14px; color:var(--info); padding:7px 0; margin-right:6px; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .notes { background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:8px 10px; font-size:13px; }
  .error { color:#d92d20; font-size:14px; white-space:pre-wrap; }
  .ok { color:var(--accent); font-size:14px; }
  form.edit { border-top:1px dashed var(--line); margin-top:12px; padding-top:4px; }
  form.edit .save { width:100%; margin-top:14px; }
  details summary { cursor:pointer; font-size:13px; color:var(--muted); margin-top:8px; }
  .more { width:100%; }
  .stats { display:flex; gap:8px; margin:4px 0 10px; }
  .stat { flex:1; background:var(--bg); border-radius:10px; padding:8px 10px; }
  .stat b { display:block; font-size:18px; }
  .stat span { font-size:12px; color:var(--muted); }
  .summary { font-size:13px; color:var(--muted); }
  .profit { font-weight:700; white-space:nowrap; }
  .profit.minus { color:#d92d20; }
  .add { width:100%; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>제주라이브 관리자</h1>
    <a href="/admin-reply.html">위챗 답변 도우미 →</a>
  </header>

  <!-- 샤오홍슈·인스타 포스팅용 브리핑 카드 (src/js/features/brief-card.js, lost-brief-card.js) -->
  <div class="card">
    <div class="row" style="flex-wrap:wrap; gap:8px;">
      <button type="button" style="flex:1 1 220px" onclick="location.href='/?brief=1'">📰 오늘의 제주 브리핑 카드 (3:4)</button>
      <button type="button" style="flex:1 1 220px; background:#2e5aac" onclick="location.href='/?brief_lost=1'">📦 분실물 주간·월간 브리핑 카드 (3:4)</button>
    </div>
    <p class="hint">오늘의 날씨·항공·축제 브리핑과 주간·월간 분실물 요약 및 고밀도 실물 사진(20~56장) 모아보기 카드를 생성·다운로드합니다.</p>
  </div>

  <div class="card" id="login">
    <label for="key" style="margin-top:0">관리자 비밀번호</label>
    <div class="row">
      <input id="key" type="password" autocomplete="current-password">
      <button id="loginBtn" style="flex:0 0 auto">불러오기</button>
    </div>
  </div>

  <div class="tabs">
    <button data-sheet="LostReport" class="on">🔍 분실신고</button>
    <button data-sheet="SuccessStories">📦 대리수령</button>
    <button data-sheet="Reservation">📅 예약</button>
    <button data-sheet="Ledger">💰 정산</button>
  </div>

  <div class="toolbar">
    <input id="q" type="search" placeholder="검색 (위챗ID, 물건, 장소…)" autocomplete="off">
    <select id="filter"></select>
  </div>
  <div class="count"><span id="count"></span><button id="reload" class="sub" type="button">↻ 새로고침</button></div>
  <p id="error" class="error" hidden></p>

  <div id="list"></div>
  <button id="more" class="sub more" hidden>더 보기</button>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PAGE = 30;
  var STEPS = { 1: '1 접수', 2: '2 물품확인중', 3: '3 수령완료', 4: '4 발송완료', 5: '5 고객 직접수령' };
  // 대리수령 수정 폼에 먼저 보일 열 (나머지 열은 아래 '기타 열'로)
  var SS_MAIN = ['Step', 'Date', 'Item', 'Region', 'Place', 'Note', 'AdminNote', 'MgmtNumber', 'WeChatId', 'RequesterName', 'Contact', 'Address'];
  var SS_HIDDEN = ['CaseId', 'Timestamp', 'UserAgent'];
  var LONG = ['Note', 'AdminNote', 'Address'];

  var state = { sheet: 'LostReport', data: {}, shown: PAGE };

  // 분실신고 찾기 서비스 (사이트 접수 후 팝업에서 고름 → 위챗 QR 결제 → 여기서 '결제 확인' → 경찰 등록 → 접수번호 기록)
  var LOST_PLANS = ['기본 9.9元', '집중 19.9元'];
  var LOST_STAGES = { wait: '💳 결제 대기', paid: '👮 경찰 등록 대기', done: '✅ 경찰 등록 완료' };
  function lostStage(r) {
    if (str(r['경찰접수번호'])) return 'done';
    if (str(r['결제상태']) === '확인') return 'paid';
    if (str(r['찾기상품'])) return 'wait';
    return '';
  }

  // 예약 (Reservation 시트) — '진행' 칸: 비어 있으면 1 접수. 2·3은 30분 안에 고객 위챗 안내(tools/minwon24.js res)
  var RES_STEPS = { 1: '1 접수', 2: '2 예약확정', 3: '3 예약불가', 4: '4 이용완료', 5: '5 취소' };
  var RES_TYPES = {
    restaurant: '식당', food: '맛집', beauty: '미용실/네일', activity: '액티비티', cake: '케이크', anniversary: '기념일 이벤트',
    snap: '스냅사진', camera: '카메라 대여', skin: '피부과', cloth: '의류대여', rental: '물품대여', course: '코스', trip: '여행 일정', other: '기타'
  };
  function resStep(r) { return Number(str(r['진행'])) || 1; }

  try { $('key').value = localStorage.getItem('adminReplyKey') || ''; } catch (e) {}

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function str(v) { return v === undefined || v === null ? '' : String(v).trim(); }
  function showError(msg) { $('error').textContent = msg || ''; $('error').hidden = !msg; }
  function safeUrl(u) { u = str(u); return /^https:\/\//i.test(u) ? u : ''; }
  function driveThumb(u) {
    var m = str(u).match(/\/d\/([\w-]{20,})/) || str(u).match(/[?&]id=([\w-]{20,})/);
    return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w600' : '';
  }

  async function api(method, body, query) {
    var key = $('key').value.trim();
    if (!key) throw new Error('비밀번호를 입력하세요.');
    var res = await fetch('/api/admin/sheet' + (query || ''), {
      method: method,
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: body ? JSON.stringify(body) : undefined
    });
    var data = await res.json().catch(function () { return { error: '서버 응답을 읽을 수 없습니다 (' + res.status + ')' }; });
    if (!res.ok || data.error) throw new Error(data.error || res.status);
    try { localStorage.setItem('adminReplyKey', key); } catch (e) {}
    return data;
  }

  async function load(force) {
    showError('');
    var sheet = state.sheet;
    if (state.data[sheet] && !force) return render();
    $('list').innerHTML = '';
    $('count').textContent = '불러오는 중…';
    $('more').hidden = true;
    try {
      state.data[sheet] = await api('GET', null, '?sheet=' + sheet);
      $('login').hidden = true;
      buildFilter();
      render();
      // 대리수령 카드에 정산 상태를 보이려면 정산표도 필요 — 뒤에서 불러와 다시 그린다
      if (sheet === 'SuccessStories' && !state.data.Ledger) {
        ensureLedger().then(function () { if (state.sheet === 'SuccessStories') render(); }).catch(function () {});
      }
    } catch (e) {
      $('count').textContent = '';
      showError(e.message);
      if (/비밀번호/.test(e.message)) $('login').hidden = false;
    }
  }

  function buildFilter() {
    var sel = $('filter');
    var rows = (state.data[state.sheet] || {}).rows || [];
    var prev = sel.value;
    sel.innerHTML = '';
    var opts = [['', '전체']];
    if (state.sheet === 'Ledger') {
      var months = {};
      rows.forEach(function (r) { var m = monthOf(r); if (m) months[m] = (months[m] || 0) + 1; });
      Object.keys(months).sort().reverse().forEach(function (m) {
        opts.push([m, m.slice(0, 4) + '년 ' + Number(m.slice(5)) + '월 (' + months[m] + ')']);
      });
    } else if (state.sheet === 'LostReport') {
      // 찾기 서비스 진행 단계 필터 (값 앞에 ':' — 물건 분류 필터와 구분)
      Object.keys(LOST_STAGES).forEach(function (k) {
        var n = rows.filter(function (r) { return lostStage(r) === k; }).length;
        if (n) opts.push([':' + k, LOST_STAGES[k] + ' (' + n + ')']);
      });
      var cats = {};
      rows.forEach(function (r) { var c = str(r.ItemCategory); if (c) cats[c] = (cats[c] || 0) + 1; });
      Object.keys(cats).sort().forEach(function (c) { opts.push([c, c + ' (' + cats[c] + ')']); });
    } else if (state.sheet === 'Reservation') {
      // 진행 단계 필터 (값 앞에 ':') + 유형 필터
      Object.keys(RES_STEPS).forEach(function (s) {
        var n = rows.filter(function (r) { return resStep(r) === Number(s); }).length;
        if (n) opts.push([':' + s, RES_STEPS[s] + ' (' + n + ')']);
      });
      var types = {};
      rows.forEach(function (r) { var t = str(r.ReservationType); if (t) types[t] = (types[t] || 0) + 1; });
      Object.keys(types).sort().forEach(function (t) { opts.push([t, (RES_TYPES[t] || t) + ' (' + types[t] + ')']); });
    } else {
      Object.keys(STEPS).forEach(function (s) {
        var n = rows.filter(function (r) { return str(r.Step) === s; }).length;
        opts.push([s, STEPS[s] + ' (' + n + ')']);
      });
    }
    opts.forEach(function (o) { var op = el('option', '', o[1]); op.value = o[0]; sel.appendChild(op); });
    sel.value = opts.some(function (o) { return o[0] === prev; }) ? prev : '';
  }

  function filtered() {
    var rows = (state.data[state.sheet] || {}).rows || [];
    var q = $('q').value.trim().toLowerCase();
    var f = $('filter').value;
    if (state.sheet === 'Ledger') {
      return rows.filter(function (r) {
        if (f && monthOf(r) !== f) return false;
        return !q || r.d.join(' ').toLowerCase().indexOf(q) !== -1;
      }).sort(function (a, b) {
        var x = ledgerDate(a), y = ledgerDate(b);
        return x === y ? b._row - a._row : (x < y ? 1 : -1);
      });
    }
    if (state.sheet === 'Reservation') {
      return rows.filter(function (r) {
        if (f && f.charAt(0) === ':') { if (resStep(r) !== Number(f.slice(1))) return false; }
        else if (f && str(r.ReservationType) !== f) return false;
        if (!q) return true;
        return Object.keys(r).some(function (k) { return str(r[k]).toLowerCase().indexOf(q) !== -1; });
      });
    }
    return rows.filter(function (r) {
      if (f && f.charAt(0) === ':') { if (lostStage(r) !== f.slice(1)) return false; }
      else if (f && str(state.sheet === 'LostReport' ? r.ItemCategory : r.Step) !== f) return false;
      if (!q) return true;
      return Object.keys(r).some(function (k) { return str(r[k]).toLowerCase().indexOf(q) !== -1; });
    });
  }

  function render() {
    var rows = filtered();
    var list = $('list');
    list.innerHTML = '';
    var total = ((state.data[state.sheet] || {}).rows || []).length;
    $('count').textContent = rows.length === total ? '총 ' + total + '건' : rows.length + '건 / 전체 ' + total + '건';
    if (state.sheet === 'Ledger') list.appendChild(ledgerTop(rows));
    rows.slice(0, state.shown).forEach(function (r) {
      list.appendChild(state.sheet === 'LostReport' ? lostCard(r) : state.sheet === 'Ledger' ? ledgerCard(r) : state.sheet === 'Reservation' ? resCard(r) : successCard(r));
    });
    $('more').hidden = rows.length <= state.shown;
  }

  function addPairs(dl, pairs) {
    pairs.forEach(function (p) {
      if (!str(p[1])) return;
      dl.appendChild(el('dt', '', p[0]));
      dl.appendChild(el('dd', '', p[1]));
    });
  }
  function joinNonEmpty(arr, sep) { return arr.map(str).filter(Boolean).join(sep); }

  function copyBtn(label, text) {
    var b = el('button', 'sub', label);
    b.type = 'button';
    b.addEventListener('click', async function () {
      try { await navigator.clipboard.writeText(text); } catch (e) { window.prompt('복사하세요', text); return; }
      b.textContent = '✅ 복사됨';
      setTimeout(function () { b.textContent = label; }, 1500);
    });
    return b;
  }

  function rawDetails(r) {
    var d = el('details');
    d.appendChild(el('summary', '', '시트 원본 전체 보기 (' + r._row + '행)'));
    var dl = el('dl');
    addPairs(dl, Object.keys(r).filter(function (k) { return k.charAt(0) !== '_'; }).map(function (k) { return [k, r[k]]; }));
    d.appendChild(dl);
    return d;
  }

  function lostCard(r) {
    var c = el('div', 'card');
    var head = el('div', 'item-head');
    var badges = el('div');
    [r.ItemCategory, r.City, r.RegionCategory].forEach(function (t, i) {
      if (str(t)) badges.appendChild(el('span', i === 0 ? 'badge strong' : 'badge', t));
    });
    var stage = lostStage(r);
    if (stage) badges.appendChild(el('span', stage === 'wait' ? 'badge warn' : 'badge info', LOST_STAGES[stage] + (str(r['찾기상품']) ? ' · ' + str(r['찾기상품']) : '')));
    if (str(r.HasIdCard) === 'Y') badges.appendChild(el('span', 'badge warn', '🚨 신분증·카드'));
    // 위챗 ID 형식이 아니면(번호·wxid_·닉네임) 자동 안내는 접수 코드 备注로만 가능
    var wx = str(r.WechatId).replace(/\s/g, '');
    if (wx && (!/^[a-zA-Z][-_a-zA-Z0-9]{5,19}$/.test(wx) || /^wxid_/i.test(wx))) badges.appendChild(el('span', 'badge warn', '⚠ 위챗ID 아님 → 备注 필요'));
    head.appendChild(badges);
    head.appendChild(el('span', 'time', r.Timestamp));
    c.appendChild(head);
    if (str(r.Specifics)) c.appendChild(el('div', 'title', r.Specifics));

    var dl = el('dl');
    addPairs(dl, [
      ['분실 일시', joinNonEmpty([r.Date, r.Time], ' ')],
      ['장소', r.DetailLocation],
      ['호텔', joinNonEmpty([r.HotelName, r.hotelRoom && r.hotelRoom + '호', r.HotelDates], ' · ')],
      ['예약자', r.HotelBooker],
      ['차량', r.CarNumber],
      ['탑승', joinNonEmpty([r.BoardLoc, r.BoardTime], ' ')],
      ['하차', joinNonEmpty([r.AlightLoc, r.AlightTime], ' ')],
      ['색상', r.ItemColor],
      ['위챗', r.WechatId],
      ['접수 코드', 'JL' + r._row + ' (친구 수락 때 备注로)'],
      ['위챗 친구', r['위챗친구']],
      ['찾기 서비스', joinNonEmpty([r['찾기상품'], r['결제상태'] && '결제 ' + r['결제상태']], ' · ')],
      ['경찰 접수', joinNonEmpty([r['경찰접수번호'], r['경찰관서'], r['경찰접수일']], ' · ')],
      ['집중 결과', joinNonEmpty([r['집중결과'], r['집중메모'], r['집중안내'] && '위챗 ' + r['집중안내']], ' · ')],
      ['찾은 습득물', joinNonEmpty([r['찾은습득물'], r['찾은경로'], r['찾은일']], ' · ')],
      ['메모', r.AdminNote]
    ]);
    c.appendChild(dl);
    if (str(r._ko)) c.appendChild(el('div', 'ko', '🇰🇷 ' + str(r._ko)));

    var photo = safeUrl(r.PhotoURL);
    if (photo) {
      var a = el('a', 'photo');
      a.href = photo; a.target = '_blank'; a.rel = 'noopener';
      var img = el('img');
      img.loading = 'lazy'; img.alt = '분실물 사진';
      img.src = driveThumb(photo) || photo;
      img.onerror = function () { a.textContent = '📷 사진 열기'; };
      a.appendChild(img);
      c.appendChild(a);
    }

    var act = el('div', 'actions');
    // 위챗 입금 금액 버튼 — 찾기상품·결제 '확인'을 한 번에 쓰고 작업 큐를 바로 '등록대기'로 (자동 등록이 경찰민원24 제출)
    if (stage === 'wait' || stage === '') {
      LOST_PLANS.forEach(function (plan) {
        var payBtn = el('button', '', '💳 ' + plan.split(' ')[1] + ' 결제');
        payBtn.type = 'button';
        payBtn.addEventListener('click', function () {
          if (!window.confirm(r._row + '행 ' + plan + ' 결제 확인 → 경찰 등록대기로 넘길까요?')) return;

    if ((stage === 'paid' || stage === 'done') && str(r['찾기상품']).indexOf('집중') !== -1 && !str(r['집중결과'])) {
      [['찾음', '🎯 집중 결과: 찾음'], ['못 찾음', '🎯 집중 결과: 못 찾음']].forEach(function (p) {

          inp.replaceWith(ta);

          // 찾았으면 그 습득물 관리번호 — 추정리스트가 맞혔는지 재는 정답 기록 (경찰 습득물 F…/유실물센터 V…)
          var atc = null;
          if (p[0] === '찾음') {
            var af = field('찾은습득물', '');
            af.querySelector('label').textContent = '찾은 습득물 관리번호 (선택 · 경찰 습득물이면 F… / V…, 호텔·식당 직접 보관이면 비움)';

          form.appendChild(msg);
          form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var fields = { '집중결과': p[0] };
            if (ta.value.trim()) fields['집중메모'] = ta.value.trim();
            var atcV = atc ? atc.value.trim().toUpperCase().replace(/-\d+$/, '') : '';
            if (atcV && !/^[FV][0-9A-Z]{10,}$/.test(atcV)) { msg.textContent = '관리번호 형식이 아닙니다 (F… 또는 V…)'; msg.hidden = false; return; }
            if (atcV) { fields['찾은습득물'] = atcV; fields['찾은경로'] = '집중'; fields['찾은일'] = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
            saveLost(c, r, fields, save, msg);
          });
          c.insertBefore(form, act.nextSibling);
          ta.focus();
        });
        act.appendChild(fb);
      });
    }
    var editBtn = el('button', 'sub', '✏️ 상태 수정');

    if (str(r['경찰접수번호'])) act.appendChild(copyBtn('접수번호 복사', str(r['경찰접수번호'])));
    c.appendChild(act);
    editBtn.addEventListener('click', function () {
      var f = c.querySelector('form.edit');
      if (f) { f.remove(); editBtn.textContent = '✏️ 상태 수정'; return; }

  // 찾기 서비스·결제·경찰 접수 칸 수정 (고객이 쓴 칸은 GAS가 막음)
  function lostEditForm(card, r) {
    var form = el('form', 'edit');
    function sel(name, options) {
      var wrap = el('div');
      var lab = el('label', '', name);
      var s = el('select');
      s.name = name;
      options.forEach(function (o) { var op = el('option', '', o || '(없음)'); op.value = o; s.appendChild(op); });
      if (options.indexOf(str(r[name])) === -1) { var op = el('option', '', str(r[name])); op.value = str(r[name]); s.appendChild(op); }
      s.value = str(r[name]);
      s.dataset.orig = str(r[name]);
      wrap.appendChild(lab);
      wrap.appendChild(s);
      return wrap;
    }
    var row1 = el('div', 'row');
    row1.appendChild(sel('찾기상품', [''].concat(LOST_PLANS)));
    row1.appendChild(sel('결제상태', ['', '대기', '확인']));
    form.appendChild(row1);
    if (str(r['찾기상품']).indexOf('집중') !== -1) {
      var row2 = el('div', 'row');
      row2.appendChild(sel('집중결과', ['', '찾음', '못 찾음']));
      form.appendChild(row2);
      form.appendChild(field('집중메모', r['집중메모']));
    }
    ['경찰접수번호', '경찰관서', '경찰접수일', '찾은습득물', '찾은경로', 'AdminNote'].forEach(function (h) {
      var f = field(h, r[h]);
      if (h === '경찰접수일') f.querySelector('input').type = 'date';
      if (h === '찾은습득물') f.querySelector('input').placeholder = '찾은 습득물 관리번호 F…/V… (추정리스트 적중률용)';
      if (h === '찾은경로') f.querySelector('input').placeholder = '예: 집중 · 후보페이지 · 고객 직접 · 호텔 보관';
      form.appendChild(f);
    });
    form.appendChild(el('div', 'notes', '기본에서 집중으로 업그레이드(10元 추가)하면 찾기상품을 바꾸세요. 경찰 접수는 북마클릿 기록 버튼을 쓰면 자동으로 채워집니다.'));
    var msg = el('p', 'error');
    msg.hidden = true;
    var save = el('button', 'save', '저장');
    save.type = 'submit';
    form.appendChild(save);
    form.appendChild(msg);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var fields = {};
      form.querySelectorAll('[name]').forEach(function (inp) {
        if (inp.value.trim() !== inp.dataset.orig) fields[inp.name] = inp.value.trim();
      });
      if (!Object.keys(fields).length) { msg.textContent = '바뀐 내용이 없습니다.'; msg.hidden = false; return; }
      saveLost(card, r, fields, save, msg);
    });
    return form;
  }

  async function saveLost(card, r, fields, btn, msg) {
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '저장 중…';
    try {
      var data = await api('POST', { sheet: 'LostReport', row: r._row, fields: fields });
      var rows = state.data.LostReport.rows;
      var i = rows.indexOf(r);
      if (i !== -1) rows[i] = data.row;
      buildFilter();
      var fresh = lostCard(data.row);
      card.replaceWith(fresh);
      var q = data.queue === '등록대기' ? ' · 작업 큐 등록대기 (30분 안에 경찰 등록)' : data.queue ? ' · 작업 큐: ' + data.queue : '';
      var lg = data.ledger ? ' · 정산표: ' + data.ledger : '';
      if (data.ledger && data.ledger.indexOf('입력') !== -1) delete state.data.Ledger;   // 정산 탭을 열 때 새로 받아 오게
      var ok = el('p', 'ok', '✅ 저장됨: ' + data.written.join(', ') + q + lg);
      fresh.appendChild(ok);
      setTimeout(function () { ok.remove(); }, 6000);
    } catch (e) {
      if (msg) { msg.textContent = e.message; msg.hidden = false; } else showError(e.message);
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  // ── 예약 카드: 접수 내역 + 진행 단계 버튼 (확정·불가는 고객에게 전할 메모와 함께 저장 → 30분 안에 위챗 안내)
  function resCard(r) {
    var c = el('div', 'card');
    var step = resStep(r);
    var code = 'RS' + r._row;
    var head = el('div', 'item-head');

    var wx = str(r.WechatId).replace(/\s/g, '');
    if (wx && !(/^[a-zA-Z_][-_a-zA-Z0-9]{5,19}$/.test(wx) && !/^wxid_/i.test(wx)) && !/^(\+?86)?1\d{10}$/.test(wx)) {
      badges.appendChild(el('span', 'badge warn', '⚠ 위챗ID 아님 → 备注 ' + code + ' 필요'));
    }

      ['예약자', r.BookerName],
      ['날짜', r.VisitDate],
      ['대체 시간', r.AltTime],
      ['인원', r.PartySize],
      ['위챗', r.WechatId],
      ['접수 코드', code + ' (친구 备注)'],
      ['요청사항', r.RequestNote],

    ]);

    var act = el('div', 'actions');

    msg.hidden = true;
    // 다음 단계 버튼 — 확정·불가는 메모 폼을 열고, 이용완료·취소는 바로 저장 (위챗 안내 없음)
    if (step <= 2) {
      [[2, '✅ 예약확정'], [3, '❌ 예약불가'], [4, '🏁 이용완료'], [5, '취소']].forEach(function (p) {
        if (p[0] <= step || (step === 2 && p[0] === 3)) return;
        var b = el('button', p[0] === 2 ? '' : 'sub', p[1]);
        b.type = 'button';
        b.addEventListener('click', function () {
          if (p[0] === 2 || p[0] === 3) return openResMemo(c, r, p[0], act);
          if (!window.confirm(code + ' 을(를) \'' + RES_STEPS[p[0]] + '\'(으)로 바꿀까요? (위챗 안내 없음)')) return;
          saveRes(c, r, { '진행': String(p[0]) }, b, msg);
        });
        act.appendChild(b);
      });
    }
    var editBtn = el('button', 'sub', '✏️ 수정');
    editBtn.type = 'button';
    act.appendChild(editBtn);
    if (str(r.WechatId)) act.appendChild(copyBtn('위챗ID 복사', str(r.WechatId)));
    act.appendChild(copyBtn('코드 ' + code + ' 복사', code));
    c.appendChild(act);
    c.appendChild(msg);
    editBtn.addEventListener('click', function () {
      var f = c.querySelector('form.edit');
      if (f) { f.remove(); editBtn.textContent = '✏️ 수정'; return; }
      c.insertBefore(resEditForm(c, r), act.nextSibling);
      editBtn.textContent = '닫기';
    });
    c.appendChild(rawDetails(r));
    return c;
  }

  // 확정·불가 — 고객에게 전할 메모(한국어, 중국어로 번역돼 같이 감)를 받아 저장
  function openResMemo(card, r, step, act) {

    form.appendChild(el('div', 'hint', 'RS' + r._row + ' 「' + RES_STEPS[step] + '」 — 저장하면 30분 안에 고객 위챗으로 안내가 나갑니다.'));

    f.querySelector('label').textContent = step === 2
      ? '고객에게 전할 메모 (예: 11/25 18:30 4명 확정, 매장 주소·예약금 안내) — 중국어로 번역됨'
      : '고객에게 전할 메모 (예: 그 시간은 만석, 19:30 가능 / 다른 매장 추천) — 중국어로 번역됨';
    var ta = el('textarea');

    var save = el('button', 'save', '저장 · 고객 안내');

    msg.hidden = true;
    form.appendChild(save);
    form.appendChild(msg);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (step === 2 && !ta.value.trim() && !window.confirm('메모 없이 확정 안내만 보낼까요? (시간·장소는 고객이 신청한 내용 그대로 안내됨)')) return;
      saveRes(card, r, { '진행': String(step), '안내메모': ta.value.trim() }, save, msg);
    });
    card.insertBefore(form, act.nextSibling);
    ta.focus();
  }

  function resEditForm(card, r) {

    form.appendChild(el('div', 'notes', '위챗안내 칸은 자동 기록(s<단계> 보냄 …)입니다. 같은 단계 안내를 다시 보내려면 이 칸을 비우세요. 진행을 1로 되돌려도 접수 안내는 다시 나가지 않습니다(칸을 비우면 다시 나감).'));
    var msg = el('p', 'error');
    msg.hidden = true;

    form.appendChild(msg);

      ev.preventDefault();
      var fields = {};
      form.querySelectorAll('[name]').forEach(function (inp) {
        if (inp.value.trim() !== inp.dataset.orig) fields[inp.name] = inp.value.trim();
      });
      if (!Object.keys(fields).length) { msg.textContent = '바뀐 내용이 없습니다.'; msg.hidden = false; return; }
      saveRes(card, r, fields, save, msg);
    });
    return form;
  }

  async function saveRes(card, r, fields, btn, msg) {
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '저장 중…';
    try {
      var data = await api('POST', { sheet: 'Reservation', row: r._row, fields: fields });
      var rows = state.data.Reservation.rows;
      var i = rows.indexOf(r);
      if (i !== -1) rows[i] = data.row;
      buildFilter();
      var fresh = resCard(data.row);
      card.replaceWith(fresh);
      var st = Number(fields['진행']);
      var ok = el('p', 'ok', '✅ 저장됨: ' + data.written.join(', ') + (st === 2 || st === 3 ? ' · 위챗 안내 30분 안에 발송' : ''));
      fresh.appendChild(ok);
      setTimeout(function () { ok.remove(); }, 6000);

      btn.disabled = false;
      btn.textContent = label;

  function successCard(r) {
    var c = el('div', 'card');
    var head = el('div', 'item-head');
    var badges = el('div');
    badges.appendChild(el('span', 'badge strong', r.CaseId));
    badges.appendChild(el('span', 'badge', STEPS[str(r.Step)] || ('Step ' + str(r.Step))));
    if (!str(r.Date)) badges.appendChild(el('span', 'badge', '사이트 비공개'));
    head.appendChild(badges);
    head.appendChild(el('span', 'time', r.Date || r.Timestamp));
    c.appendChild(head);
    c.appendChild(el('div', 'title', joinNonEmpty([r.Item, r.Place], ' · ') || '(물건 미입력)'));

    var dl = el('dl');
    addPairs(dl, [['지역', r.Region], ['위챗', r.WeChatId], ['신청자', r.RequesterName], ['관리번호', r.MgmtNumber], ['메모', r.AdminNote], ['공개 노트', r.Note], ['위챗 안내', r['위챗안내']]]);
    c.appendChild(dl);

    // 정산표 연결: 비고에 케이스 번호(JEJU-0060)가 들어간 줄 = 이 케이스의 정산
    var led = caseLedgerRows(r.CaseId);
    if (led) {
      var pc = ledgerCol('순수익');
      if (led.length) {
        var sum = led.reduce(function (s, x) { return s + (pc === -1 ? 0 : num(x.v[pc])); }, 0);
        c.appendChild(el('div', 'ko', '💰 정산표 ' + led.length + '줄 · 순수익 ' + won(sum)));
      } else if (Number(str(r.Step)) >= 3) {
        badges.appendChild(el('span', 'badge warn', '정산 미입력'));
      }
    }

    var act = el('div', 'actions');
    var editBtn = el('button', 'sub', '✏️ 수정');
    editBtn.type = 'button';
    act.appendChild(editBtn);
    var payBtn = el('button', 'sub', led && led.length ? '💰 정산 수정' : '💰 정산 입력');
    payBtn.type = 'button';
    act.appendChild(payBtn);
    if (str(r.WeChatId)) act.appendChild(copyBtn('위챗ID 복사', str(r.WeChatId)));
    [['ItemImg', '물건 사진'], ['PassportPhoto', '여권'], ['ReservationPhoto', '예약 캡처']].forEach(function (p) {
      var u = safeUrl(r[p[0]]);
      if (!u) return;
      var a = el('a', '', '📷 ' + p[1]);
      a.href = u; a.target = '_blank'; a.rel = 'noopener';
      act.appendChild(a);
    });
    c.appendChild(act);

    // 단계 바로 바꾸기 — 시트 SuccessStories 의 Step 칸에 저장. 1~3단계는 30분 안에 고객 위챗 안내가 자동으로 나감
    var cur = Number(str(r.Step)) || 0;
    var stepBar = el('div', 'actions');
    var stepMsg = el('p', 'error');
    stepMsg.hidden = true;
    Object.keys(STEPS).forEach(function (s) {
      if (Number(s) <= cur || cur >= 4) return;   // 앞 단계로만 (4 발송완료·5 직접수령 = 끝, 되돌리기는 ✏️ 수정)
      var b = el('button', Number(s) === cur + 1 ? '' : 'sub', '→ ' + STEPS[s]);
      b.type = 'button';
      b.addEventListener('click', async function () {
        var auto = Number(s) <= 3 && Number(str(r.CaseId).replace(/\D/g, '')) >= 60;
        if (!confirm(r.CaseId + ' 단계를 \'' + STEPS[s] + '\'(으)로 바꿀까요?\n' + (auto ? '30분 안에 고객 위챗으로 이 단계 안내가 자동 발송됩니다.' : '고객 위챗 자동 안내는 없습니다' + (s === '4' ? ' — 송장번호는 직접 안내해 주세요.' : '.')))) return;
        stepBar.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
        stepMsg.hidden = true;
        try {
          var data = await api('POST', { caseId: r.CaseId, fields: { Step: s } });
          var rows = state.data.SuccessStories.rows;
          var i = rows.indexOf(r);
          if (i !== -1) rows[i] = data.row;
          buildFilter();
          var fresh = successCard(data.row);
          c.replaceWith(fresh);
          var ok = el('p', 'ok', '✅ ' + STEPS[s] + '(으)로 저장됨' + (auto ? ' · 위챗 안내 30분 안에 발송' : ''));
          fresh.appendChild(ok);
          setTimeout(function () { ok.remove(); }, 5000);
        } catch (e) {
          stepMsg.textContent = e.message;
          stepMsg.hidden = false;
          stepBar.querySelectorAll('button').forEach(function (x) { x.disabled = false; });
        }
      });
      stepBar.appendChild(b);
    });
    if (stepBar.children.length) { c.appendChild(stepBar); c.appendChild(stepMsg); }

    editBtn.addEventListener('click', function () {
      var f = c.querySelector('form.edit');
      if (f) { f.remove(); editBtn.textContent = '✏️ 수정'; return; }
      c.appendChild(editForm(r));
      editBtn.textContent = '닫기';
    });
    payBtn.addEventListener('click', async function () {
      var f = c.querySelector('form.edit');
      if (f) { f.remove(); payBtn.textContent = led && led.length ? '💰 정산 수정' : '💰 정산 입력'; return; }
      payBtn.disabled = true;
      try { await ensureLedger(); } catch (e) { showError(e.message); payBtn.disabled = false; return; }
      payBtn.disabled = false;
      var rows = caseLedgerRows(r.CaseId) || [];
      var code = str(r.CaseId).toUpperCase();
      var preset = {};
      var ic = ledgerCol('항목'), nc = ledgerCol('비고');
      if (ic !== -1) preset[ic] = str(r.Item);
      if (nc !== -1) preset[nc] = code;
      var saved = function () {
        var fresh = successCard(r);
        c.replaceWith(fresh);
        var ok = el('p', 'ok', '✅ 정산표에 저장됨 (' + code + ')');
        fresh.appendChild(ok);
        setTimeout(function () { ok.remove(); }, 5000);
      };
      // 이미 줄이 있으면 마지막 줄을 고친다 (추가 비용은 정산 탭에서 비고에 같은 번호를 넣어 새 줄로)
      var form = ledgerForm(rows.length ? rows[rows.length - 1] : null, preset, saved);
      form.insertBefore(el('div', 'hint', rows.length
        ? code + ' 정산 줄을 고칩니다. 비용이 더 생기면 정산 탭에서 비고에 ' + code + ' 를 넣어 새 줄로 추가하세요.'
        : '받은 돈(수거비·배송비 ¥)과 쓴 돈(박스비·배송비 ₩)을 넣으세요. 비고의 ' + code + ' 로 이 케이스와 연결됩니다.'), form.firstChild);
      c.appendChild(form);
      payBtn.textContent = '닫기';
    });
    return c;
  }

  // 이 케이스의 정산 줄 (정산표를 아직 안 불러왔으면 null)
  function caseLedgerRows(caseId) {
    if (!state.data.Ledger) return null;
    var nc = ledgerCol('비고'), id = str(caseId).trim();
    if (nc === -1 || !id) return [];
    var re = new RegExp('(^|[^0-9A-Za-z])' + id.replace(/[^0-9A-Za-z]/g, '[-\\s]?') + '(?!\\d)', 'i');
    return ledger().rows.filter(function (x) { return re.test(str(x.d[nc])); });
  }
  async function ensureLedger() {
    if (!state.data.Ledger) state.data.Ledger = await api('GET', null, '?sheet=Ledger');
  }

  function field(name, value) {
    var wrap = el('div');
    var id = 'f_' + Math.random().toString(36).slice(2);
    var lab = el('label', '', name);
    lab.htmlFor = id;
    wrap.appendChild(lab);
    var input;
    if (name === 'Step') {
      input = el('select');
      Object.keys(STEPS).forEach(function (s) { var o = el('option', '', STEPS[s]); o.value = s; input.appendChild(o); });
      if (!STEPS[str(value)]) { var o = el('option', '', str(value) || '(비어 있음)'); o.value = str(value); input.appendChild(o); }
    } else if (LONG.indexOf(name) !== -1) {
      input = el('textarea');
    } else {
      input = el('input');
      if (name === 'Date' && (!str(value) || /^\d{4}-\d{2}-\d{2}$/.test(str(value)))) input.type = 'date';
    }
    input.id = id;
    input.name = name;
    input.value = str(value);
    input.dataset.orig = str(value);
    wrap.appendChild(input);
    if (name === 'Date') wrap.appendChild(el('div', 'hint', '비워 두면 사이트 대리수령 목록에 표시되지 않습니다.'));
    return wrap;
  }

  function editForm(r) {
    var form = el('form', 'edit');
    var headers = (state.data.SuccessStories || {}).headers || [];
    var main = SS_MAIN.filter(function (h) { return headers.indexOf(h) !== -1; });
    var rest = headers.filter(function (h) { return main.indexOf(h) === -1 && SS_HIDDEN.indexOf(h) === -1; });

    var row1 = el('div', 'row');
    ['Step', 'Date'].forEach(function (h) { if (main.indexOf(h) !== -1) row1.appendChild(field(h, r[h])); });
    form.appendChild(row1);
    main.filter(function (h) { return h !== 'Step' && h !== 'Date'; }).forEach(function (h) { form.appendChild(field(h, r[h])); });
    form.appendChild(el('div', 'notes', 'Item·Region·Place(한국어)를 고치면 zh/en 번역은 저장할 때 자동으로 다시 만듭니다. 번역을 직접 고치려면 아래 \'기타 열\'에서 수정하세요.'));

    if (rest.length) {
      var d = el('details');
      d.appendChild(el('summary', '', '기타 열 (번역·사진 링크 등 ' + rest.length + '개)'));
      rest.forEach(function (h) { d.appendChild(field(h, r[h])); });
      form.appendChild(d);
    }

    var msg = el('p', 'error');
    msg.hidden = true;
    var save = el('button', 'save', '저장');
    save.type = 'submit';
    form.appendChild(save);
    form.appendChild(msg);

    form.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var fields = {};
      form.querySelectorAll('[name]').forEach(function (inp) {
        if (inp.value.trim() !== inp.dataset.orig) fields[inp.name] = inp.value.trim();
      });
      msg.hidden = true;
      if (!Object.keys(fields).length) { msg.className = 'error'; msg.textContent = '바뀐 내용이 없습니다.'; msg.hidden = false; return; }
      save.disabled = true;
      save.textContent = '저장 중…';
      try {
        var data = await api('POST', { caseId: r.CaseId, fields: fields });
        var rows = state.data.SuccessStories.rows;
        var i = rows.indexOf(r);
        if (i !== -1) rows[i] = data.row;
        buildFilter();
        var card = form.parentNode;
        var fresh = successCard(data.row);
        card.replaceWith(fresh);
        var ok = el('p', 'ok', '✅ 저장됨: ' + data.written.join(', '));
        fresh.appendChild(ok);
        setTimeout(function () { ok.remove(); }, 4000);
      } catch (e) {
        msg.className = 'error';
        msg.textContent = e.message;
        msg.hidden = false;
        save.disabled = false;
        save.textContent = '저장';
      }
    });
    return form;
  }

  // ── 정산표: 열 이름·수식은 GAS가 시트에서 읽어 headers 로 내려줌 (수식 열은 수정 불가)
  function ledger() { return state.data.Ledger || { headers: [], summary: [], rows: [] }; }
  function ledgerCol(name) {
    var hs = ledger().headers;
    for (var i = 0; i < hs.length; i++) if (hs[i].name.indexOf(name) !== -1) return i;
    return -1;
  }
  function dateColIdx() {
    var hs = ledger().headers;
    for (var i = 0; i < hs.length; i++) if (hs[i].date) return i;
    return -1;
  }
  // 정렬용 yyyy-MM-dd (시트에 '2026. 4. 5' 같은 글자로 들어간 날짜도 처리)
  function ledgerDate(r) {
    var c = dateColIdx();
    if (c === -1) return '';
    var m = str(r.v[c]).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/) || str(r.d[c]).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    return m ? m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2) : '';
  }
  function monthOf(r) { return ledgerDate(r).slice(0, 7); }
  function num(v) {
    if (typeof v === 'number') return v;
    var n = parseFloat(str(v).replace(/[^\d.-]/g, ''));
    return isNaN(n) ? 0 : n;
  }
  function won(n) { return (n < 0 ? '-₩' : '₩') + Math.abs(Math.round(n)).toLocaleString('ko-KR'); }
  function todayKst() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); }
  function isEmptyCell(s) { s = str(s); return !s || s === '-' || /^[₩¥]?0(\.0+)?$/.test(s.replace(/,/g, '')); }

  function ledgerTop(rows) {
    var c = el('div', 'card');
    ledger().summary.forEach(function (line) {
      var t = line.map(str).filter(Boolean).join('  ');
      if (t) c.appendChild(el('div', 'summary', t));
    });
    var pc = ledgerCol('순수익');
    var month = todayKst().slice(0, 7);
    var monthRows = ledger().rows.filter(function (r) { return monthOf(r) === month; });
    var sum = function (rs) { return rs.reduce(function (s, r) { return s + (pc === -1 ? 0 : num(r.v[pc])); }, 0); };
    var stats = el('div', 'stats');
    var BREAK_EVEN = 170000;   // 월 손익분기점 (운영자 지정 2026-11-18)
    var gap = sum(monthRows) - BREAK_EVEN;
    [[won(sum(monthRows)), '이번 달 순수익 · ' + monthRows.length + '건'],
     [(gap > 0 ? '+' : '') + won(gap), '이번 달 손익분기(' + won(BREAK_EVEN) + ') 대비', gap >= 0 ? '#16a34a' : '#dc2626']
    ].forEach(function (s) {
      var d = el('div', 'stat');
      var b = el('b', '', s[0]);
      if (s[2]) b.style.color = s[2];
      d.appendChild(b);
      d.appendChild(el('span', '', s[1]));
      stats.appendChild(d);
    });
    c.appendChild(stats);
    var add = el('button', 'add', '+ 새 정산 입력');
    add.type = 'button';
    add.addEventListener('click', function () {
      var f = c.querySelector('form.edit');
      if (f) { f.remove(); add.textContent = '+ 새 정산 입력'; return; }
      c.appendChild(ledgerForm(null));
      add.textContent = '닫기';
    });
    c.appendChild(add);
    return c;
  }

  function ledgerCard(r) {
    var hs = ledger().headers;
    var dc = dateColIdx(), ic = ledgerCol('항목'), pc = ledgerCol('순수익'), nc = ledgerCol('비고');
    var c = el('div', 'card');
    var head = el('div', 'item-head');
    var left = el('div');
    if (dc !== -1) left.appendChild(el('span', 'badge strong', r.d[dc]));
    left.appendChild(el('div', 'title', ic !== -1 && !isEmptyCell(r.d[ic]) ? r.d[ic] : '(항목 없음)'));
    head.appendChild(left);
    if (pc !== -1) head.appendChild(el('span', 'profit' + (num(r.v[pc]) < 0 ? ' minus' : ''), r.d[pc]));
    c.appendChild(head);

    var dl = el('dl');
    addPairs(dl, hs.map(function (h, i) {
      if (i === dc || i === ic || i === pc || i === nc || isEmptyCell(r.d[i])) return ['', ''];
      return [h.name, r.d[i]];
    }));
    c.appendChild(dl);
    if (nc !== -1 && !isEmptyCell(r.d[nc])) c.appendChild(el('div', 'ko', r.d[nc]));

    var act = el('div', 'actions');
    var editBtn = el('button', 'sub', '✏️ 수정');
    editBtn.type = 'button';
    editBtn.addEventListener('click', function () {
      var f = c.querySelector('form.edit');
      if (f) { f.remove(); editBtn.textContent = '✏️ 수정'; return; }
      c.appendChild(ledgerForm(r));
      editBtn.textContent = '닫기';
    });
    act.appendChild(editBtn);
    c.appendChild(act);
    return c;
  }

  // 박스크기·택배사처럼 같은 값을 되풀이해 쓰는 글자 열 → 예전 값을 고를 수 있게
  function ledgerChoices(i) {
    var seen = {}, out = [];
    ledger().rows.slice().reverse().forEach(function (r) {
      var v = str(r.d[i]).trim();
      if (v && v !== '-' && !seen[v] && out.length < 15) { seen[v] = 1; out.push(v); }
    });
    return out;
  }
  // 박스크기를 고르면 그 크기의 최근 박스비를 채운다 (비어 있을 때만)
  function lastBoxCost(size) {
    var sc = ledgerCol('박스크기'), bc = ledgerCol('박스비');
    if (sc === -1 || bc === -1) return '';
    var rows = ledger().rows;
    for (var k = rows.length - 1; k >= 0; k--) if (str(rows[k].d[sc]).trim() === size && num(rows[k].v[bc]) > 0) return num(rows[k].v[bc]);
    return '';
  }

  // preset: 새 행에 미리 채울 값 { 열번호: 값 } / onSaved: 저장 뒤 처리 (없으면 정산 탭 다시 그림)
  function ledgerForm(r, preset, onSaved) {
    var hs = ledger().headers;
    var form = el('form', 'edit');
    var auto = [];
    hs.forEach(function (h, i) {
      if (h.formula) { auto.push(h.name); return; }
      var wrap = el('div');
      var id = 'l_' + Math.random().toString(36).slice(2);
      var lab = el('label', '', h.name + (h.currency && h.name.indexOf(h.currency) === -1 ? ' ' + h.currency : ''));
      lab.htmlFor = id;
      wrap.appendChild(lab);
      var input = el('input');
      input.id = id;
      input.dataset.col = i;
      var v = r ? (h.number || h.date ? r.v[i] : r.d[i]) : (preset && preset[i] !== undefined ? preset[i] : h.date ? todayKst() : '');
      v = str(v);
      if (h.date && (!v || /^\d{4}-\d{2}-\d{2}$/.test(v))) input.type = 'date';
      if (h.number) { input.inputMode = 'decimal'; input.dataset.number = '1'; }
      input.value = v;
      input.dataset.orig = r ? v : '';
      wrap.appendChild(input);
      if (!h.number && !h.date && /박스크기|택배사/.test(h.name)) {
        var dl = el('datalist');
        dl.id = id + '_dl';
        ledgerChoices(i).forEach(function (c) { var o = el('option'); o.value = c; dl.appendChild(o); });
        input.setAttribute('list', dl.id);
        wrap.appendChild(dl);
      }
      if (/박스크기/.test(h.name)) {
        input.addEventListener('change', function () {
          var box = form.querySelector('input[data-col="' + ledgerCol('박스비') + '"]');
          var cost = lastBoxCost(input.value.trim());
          if (box && !box.value.trim() && cost !== '') box.value = cost;
        });
      }
      form.appendChild(wrap);
    });
    if (auto.length) form.appendChild(el('div', 'hint', '자동 계산(수식) 열: ' + auto.join(', ') + ' — 저장하면 시트 수식으로 다시 계산됩니다.'));

    var msg = el('p', 'error');
    msg.hidden = true;
    var save = el('button', 'save', r ? '저장' : '추가');
    save.type = 'submit';
    form.appendChild(save);
    form.appendChild(msg);

    form.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var values = {};
      form.querySelectorAll('input[data-col]').forEach(function (inp) {
        var val = inp.value.trim();
        if (val === inp.dataset.orig) return;
        if (inp.dataset.number && val !== '') {
          var n = Number(val.replace(/[₩¥,\s]/g, ''));
          if (isNaN(n)) { values = null; msg.textContent = inp.previousSibling.textContent + ': 숫자만 입력하세요.'; return; }
          val = n;
        }
        if (values) values[inp.dataset.col] = val;
      });
      if (!values) { msg.hidden = false; return; }
      msg.hidden = true;
      if (!Object.keys(values).length) { msg.textContent = r ? '바뀐 내용이 없습니다.' : '내용을 입력하세요.'; msg.hidden = false; return; }
      save.disabled = true;
      save.textContent = '저장 중…';
      try {
        var data = await api('POST', { sheet: 'Ledger', row: r ? r._row : null, orig: r ? r.d : null, values: values });
        state.data.Ledger = data.ledger;
        if (onSaved) return onSaved(data);
        buildFilter();
        render();
        $('count').textContent += ' · ✅ ' + data.row + '행 ' + (r ? '수정됨' : '추가됨');
      } catch (e) {
        msg.textContent = e.message;
        msg.hidden = false;
        save.disabled = false;
        save.textContent = r ? '저장' : '추가';
      }
    });
    return form;
  }

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      state.sheet = b.dataset.sheet;
      state.shown = PAGE;
      $('q').value = '';
      $('filter').innerHTML = '';
      if (state.data[state.sheet]) buildFilter();
      load();
    });
  });
  $('q').addEventListener('input', function () { state.shown = PAGE; render(); });
  $('filter').addEventListener('change', function () { state.shown = PAGE; render(); });
  $('more').addEventListener('click', function () { state.shown += PAGE; render(); });
  $('reload').addEventListener('click', function () { load(true); });
  $('loginBtn').addEventListener('click', function () { load(true); });
  $('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(true); });

  if ($('key').value) load(); else $('login').hidden = false;
})();
</script>
</body>
</html>
