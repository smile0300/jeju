<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>습득물 후보 모니터</title>
<!-- 분실 건별 습득물 후보(작업 큐 후보JSON)를 품목별로. 읽기 전용 — 데이터: /api/admin/sheet?sheet=Candidates → GAS adminCandidates -->
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2430; --muted:#6b7684; --line:#dde2e8; --accent:#07c160; --hi:#e8590c; --mid:#b7791f; --lo:#718096; --info-bg:#eef4ff; --info:#2e5aac; --ok-bg:#e7f8ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161b; --card:#1c222a; --text:#e6eaef; --muted:#9aa4b0; --line:#2e3640; --info-bg:#18243a; --info:#8fb3ff; --ok-bg:#12291d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 12px; }
  h1 { font-size:19px; margin:0; }
  header a { font-size:14px; color:var(--muted); white-space:nowrap; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  input, select { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:9px 14px; background:var(--accent); color:#fff; cursor:pointer; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; min-width:0; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px; -webkit-overflow-scrolling:touch; }
  .chip { flex:none; background:var(--card); color:var(--text); border:1px solid var(--line); font-weight:500; font-size:13px; padding:6px 11px; border-radius:99px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:10px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; }
  .stat b { display:block; font-size:17px; }
  .stat span { font-size:11px; color:var(--muted); }
  h2 { font-size:15px; margin:18px 2px 8px; display:flex; justify-content:space-between; }
  h2 small { color:var(--muted); font-weight:400; }
  .case-head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .code { font-weight:700; }
  .sub { color:var(--muted); font-size:12px; word-break:break-all; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); margin:4px 4px 0 0; white-space:nowrap; }
  .badge.info { background:var(--info-bg); border-color:var(--info); color:var(--info); font-weight:600; }
  .badge.ok { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .cands { margin-top:8px; border-top:1px solid var(--line); }
  .cand { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .cand:last-child { border-bottom:0; }
  .cand.hit { background:var(--ok-bg); margin:0 -14px; padding:8px 14px; }
  .ph { flex:none; width:56px; height:56px; border-radius:8px; background:var(--bg); border:1px solid var(--line); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); }
  .ph img { width:100%; height:100%; object-fit:cover; }
  .cbody { flex:1; min-width:0; }
  .cname { font-weight:600; word-break:break-all; }
  .p { font-weight:700; font-size:12px; }
  .p.hi { color:var(--hi); } .p.mid { color:var(--mid); } .p.lo { color:var(--lo); }
  .mono { font-family:ui-monospace, Menlo, monospace; font-size:11px; }
  .empty { color:var(--muted); font-size:13px; padding:6px 0 0; }
  .state { color:var(--muted); text-align:center; padding:30px 0; }
  .error { color:#d92d20; font-size:14px; }
  [hidden] { display:none !important; }
  @media (max-width:480px) { .stat { padding:6px 2px; } .stat b { font-size:15px; } .stat span { font-size:10px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>🧩 습득물 후보 모니터</h1>
    <a href="/admin.html">← 관리자</a>
  </header>

  <div class="card" id="login" hidden>
    <div class="row">
      <input id="key" type="password" autocomplete="current-password" placeholder="관리자 비밀번호">
      <button id="loginBtn" type="button" style="flex:0 0 auto">불러오기</button>
    </div>
  </div>

  <div id="tools" hidden>
    <div class="stats" id="stats"></div>
    <div class="chips" id="cats"></div>
    <div class="row" style="margin-bottom:6px">
      <select id="scope">
        <option value="paid">결제한 건</option>
        <option value="all">전체</option>
        <option value="unpaid">미결제</option>
      </select>
      <select id="only">
        <option value="cand">후보 있는 건만</option>
        <option value="">후보 없는 건 포함</option>
        <option value="hi">유력(0.6+) 후보만</option>
        <option value="found">찾은 건만</option>
      </select>
    </div>
    <input id="q" type="search" placeholder="검색 (JL번호, 물건, 관리번호, 보관처…)" autocomplete="off">
  </div>
  <p id="error" class="error" hidden></p>
  <div id="list"><p class="state">불러오는 중…</p></div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CAT = { PRA000: '가방', PRH000: '지갑', PRJ000: '휴대폰', PRG000: '전자기기', PRI000: '컴퓨터', PRN000: '증명서·여권', PRP000: '카드', PRL000: '현금',
    PRO000: '귀금속', PRK000: '의류', PRC000: '서류', PRB000: '도서용품', PRQ000: '쇼핑백', PRE000: '스포츠용품', PRR000: '악기', PRM000: '유가증권', PRF000: '자동차', PRD000: '산업용품', PRZ000: '기타물품' };
  var SRC = { initial: '첫 검색', watch: '감시', name: '이름' };
  var rows = [], cat = '';
  try { $('key').value = localStorage.getItem('adminReplyKey') || ''; } catch (e) {}

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = String(text); return n; }
  function str(v) { return v == null ? '' : String(v).trim(); }
  function catOf(r) { return CAT[r.lclsf] ? r.lclsf : 'etc'; }
  function catName(c) { return CAT[c] || '분류 없음'; }
  function paid(r) { return str(r.paid) === '확인' || !!str(r.police) || str(r.status) === '완료'; }
  function foundId(r) { return str(r.found).toUpperCase(); }
  function tier(p) { return p >= 0.6 ? ['hi', '유력'] : p >= 0.3 ? ['mid', '가능'] : ['lo', '낮음']; }
  function recent(at) { return at && (Date.now() - Date.parse(at)) < 3 * 864e5; }

  async function load() {
    $('error').hidden = true;
    var key = $('key').value.trim();
    if (!key) { $('login').hidden = false; $('list').innerHTML = ''; return; }
    $('list').innerHTML = '<p class="state">불러오는 중…</p>';
    try {
      var res = await fetch('/api/admin/sheet?sheet=Candidates', { headers: { 'X-Admin-Key': key } });
      var data = await res.json().catch(function () { return { error: '서버 응답을 읽을 수 없습니다 (' + res.status + ')' }; });
      if (!res.ok || data.error) throw new Error(data.error || res.status);
      try { localStorage.setItem('adminReplyKey', key); } catch (e) {}
      rows = data.rows || [];
      $('login').hidden = true; $('tools').hidden = false;
      render();
    } catch (e) {
      $('list').innerHTML = '';
      $('error').textContent = e.message; $('error').hidden = false;
      if (/비밀번호|unauthorized/i.test(e.message)) $('login').hidden = false;
    }
  }

  function filtered(ignoreCat) {
    var scope = $('scope').value, only = $('only').value, q = $('q').value.trim().toLowerCase();
    return rows.filter(function (r) {
      if (scope === 'paid' && !paid(r)) return false;
      if (scope === 'unpaid' && paid(r)) return false;
      if (only === 'cand' && !r.cands.length) return false;
      if (only === 'hi' && !r.cands.some(function (c) { return Number(c.p) >= 0.6; })) return false;
      if (only === 'found' && !foundId(r)) return false;
      if (!ignoreCat && cat && catOf(r) !== cat) return false;
      if (q) {
        var hay = ['JL' + r.lostRow, r.itemName, r.specifics, r.brand, r.found].concat(r.cands.map(function (c) { return [c.id, c.name, c.place].join(' '); })).join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function render() {
    var base = filtered(true);
    // 품목 칩 (현재 필터 기준 건수)
    var counts = {};
    base.forEach(function (r) { var c = catOf(r); counts[c] = (counts[c] || 0) + 1; });
    var order = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    if (cat && !counts[cat]) cat = '';
    var chips = $('cats'); chips.innerHTML = '';
    [['', '전체', base.length]].concat(order.map(function (c) { return [c, catName(c), counts[c]]; })).forEach(function (o) {
      var b = el('button', 'chip' + (cat === o[0] ? ' on' : ''), o[1] + ' ' + o[2]);
      b.type = 'button';
      b.addEventListener('click', function () { cat = o[0]; render(); });
      chips.appendChild(b);
    });

    var list = filtered(false);
    // 요약 — 후보 수·유력·새 후보(3일)·찾은 건
    var nC = 0, nHi = 0, nNew = 0, nFound = 0;
    list.forEach(function (r) {
      nC += r.cands.length;
      nHi += r.cands.filter(function (c) { return Number(c.p) >= 0.6; }).length;
      nNew += r.cands.filter(function (c) { return c.src === 'watch' && recent(c.at); }).length;
      if (foundId(r)) nFound++;
    });
    var st = $('stats'); st.innerHTML = '';
    [[list.length, '분실 건'], [nC, '후보'], [nHi, '유력 후보'], [nNew, '새 후보(3일)']].forEach(function (s) {
      var d = el('div', 'stat'); d.appendChild(el('b', '', s[0])); d.appendChild(el('span', '', s[1])); st.appendChild(d);
    });

    var box = $('list'); box.innerHTML = '';
    if (!list.length) { box.appendChild(el('p', 'state', '조건에 맞는 건이 없습니다.')); return; }
    var groups = {};
    list.forEach(function (r) { (groups[catOf(r)] = groups[catOf(r)] || []).push(r); });
    Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; }).forEach(function (c) {
      var h = el('h2', '', catName(c)); h.appendChild(el('small', '', groups[c].length + '건'));
      box.appendChild(h);
      groups[c].forEach(function (r) { box.appendChild(caseCard(r)); });
    });
    if (nFound) box.appendChild(el('p', 'empty', '찾은 건 ' + nFound + '건 — 초록 줄이 실제로 찾은 습득물입니다.'));
  }

  function caseCard(r) {
    var card = el('div', 'card');
    var head = el('div', 'case-head');
    head.appendChild(el('span', 'code', 'JL' + r.lostRow + ' · ' + (r.itemName || r.category || '(물품명 없음)')));
    head.appendChild(el('span', 'sub', '분실 ' + str(r.lostYmd).slice(0, 10)));
    card.appendChild(head);
    if (r.specifics) card.appendChild(el('div', 'sub', r.specifics));
    var tags = el('div');
    if (r.plan) tags.appendChild(el('span', 'badge', r.plan));
    tags.appendChild(el('span', 'badge' + (paid(r) ? ' info' : ''), r.police ? '👮 경찰 등록' : paid(r) ? '결제 확인' : (r.status || '대기')));
    if (r.watched) tags.appendChild(el('span', 'badge', '알림 ' + r.watched + '건'));
    if (r.focus) tags.appendChild(el('span', 'badge', '집중: ' + r.focus));
    if (foundId(r)) tags.appendChild(el('span', 'badge ok', '✅ 찾음 ' + (r.foundRoute || '')));
    card.appendChild(tags);

    var cands = r.cands.slice().sort(function (a, b) { return Number(b.p) - Number(a.p); });
    if (!cands.length) { card.appendChild(el('div', 'empty', '후보 없음')); return card; }
    var wrap = el('div', 'cands');
    var fid = foundId(r);
    cands.forEach(function (c) {
      var row = el('div', 'cand' + (fid && str(c.id).toUpperCase() === fid ? ' hit' : ''));
      var ph = el('div', 'ph');
      if (c.img) {
        var img = new Image(); img.loading = 'lazy'; img.alt = '';
        img.src = '/api/public-data?url=' + encodeURIComponent(c.img);
        img.onerror = function () { ph.textContent = '사진 없음'; };
        ph.appendChild(img);
      } else ph.textContent = '사진 없음';
      row.appendChild(ph);
      var b = el('div', 'cbody');
      var t = tier(Number(c.p) || 0);
      var top = el('div');
      top.appendChild(el('span', 'p ' + t[0], t[1] + ' ' + Number(c.p || 0).toFixed(2)));
      top.appendChild(el('span', 'badge', SRC[c.src] || c.src || ''));
      if (c.src === 'watch' && recent(c.at)) top.appendChild(el('span', 'badge info', 'NEW'));
      b.appendChild(top);
      b.appendChild(el('div', 'cname', c.name || '(물품명 없음)'));
      b.appendChild(el('div', 'sub', '습득 ' + (c.date || '-') + ' · ' + (c.place || '-') + (c.at ? ' · 올림 ' + c.at : '')));
      b.appendChild(el('div', 'sub mono', c.id || ''));
      row.appendChild(b);
      wrap.appendChild(row);
    });
    card.appendChild(wrap);
    return card;
  }

  ['scope', 'only'].forEach(function (id) { $(id).addEventListener('change', render); });
  $('q').addEventListener('input', render);
  $('loginBtn').addEventListener('click', load);
  $('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  load();
})();
</script>
</body>
</html>
