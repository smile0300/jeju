<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>위챗 답변 도우미</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2430; --muted:#6b7684; --line:#dde2e8; --accent:#07c160; --warn:#b54708; --warn-bg:#fff4e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161b; --card:#1c222a; --text:#e6eaef; --muted:#9aa4b0; --line:#2e3640; --warn:#fdb022; --warn-bg:#2d2310; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  label:first-child { margin-top:0; }
  input, textarea, select { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
  textarea { resize:vertical; min-height:110px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { width:100%; font:inherit; font-weight:600; border:0; border-radius:10px; padding:13px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  button.sub { background:transparent; color:var(--text); border:1px solid var(--line); padding:9px; font-weight:500; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); margin-right:4px; }
  .notes { background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:10px; font-size:14px; white-space:pre-wrap; }
  .ko { color:var(--muted); font-size:14px; white-space:pre-wrap; }
  .error { color:#d92d20; font-size:14px; white-space:pre-wrap; }
  pre { font-size:12px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; margin:8px 0 0; }
  details summary { cursor:pointer; font-size:14px; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>위챗 답변 도우미</h1>

  <div class="card">
    <label for="key">관리자 비밀번호</label>
    <input id="key" type="password" autocomplete="current-password">

    <div class="row">
      <div>
        <label for="wechat">고객 위챗ID</label>
        <input id="wechat" autocapitalize="off" autocomplete="off">
      </div>
      <div>
        <label for="caseId">접수번호 (선택)</label>
        <input id="caseId" placeholder="jeju-0001" autocapitalize="off" autocomplete="off">
      </div>
    </div>

    <label for="message">고객 메시지 (위챗에서 복사해서 붙여넣기)</label>
    <textarea id="message"></textarea>

    <label for="engine">AI</label>
    <select id="engine">
      <option value="claude">Claude Sonnet 5</option>
      <option value="gemini">Gemini Pro</option>
    </select>

    <div style="margin-top:14px"><button id="go">답변 초안 만들기</button></div>
    <p id="error" class="error" hidden></p>
  </div>

  <div id="result" class="card" hidden>
    <div id="meta" style="margin-bottom:8px"></div>
    <label for="replyZh">중국어 답변 (수정 가능)</label>
    <textarea id="replyZh" style="min-height:140px"></textarea>
    <div style="margin-top:8px"><button id="copy" class="sub">📋 복사하기</button></div>
    <label>한국어 번역</label>
    <div id="replyKo" class="ko"></div>
    <div id="notesWrap" hidden>
      <label>보내기 전 확인</label>
      <div id="notes" class="notes"></div>
    </div>
    <details style="margin-top:12px">
      <summary>시트 조회 결과 보기</summary>
      <pre id="records"></pre>
    </details>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CATEGORY = { lost_found: '분실물', reservation: '예약', payment: '결제', other: '기타' };

  // 비밀번호와 AI 선택은 이 기기에만 기억
  try {
    $('key').value = localStorage.getItem('adminReplyKey') || '';
    $('engine').value = localStorage.getItem('adminReplyEngine') || 'claude';
  } catch (e) {}

  function showError(msg) { $('error').textContent = msg; $('error').hidden = !msg; }

  $('go').addEventListener('click', async function () {
    showError('');
    var key = $('key').value.trim();
    if (!key) return showError('비밀번호를 입력하세요.');
    if (!$('message').value.trim()) return showError('고객 메시지를 붙여넣으세요.');
    try {
      localStorage.setItem('adminReplyKey', key);
      localStorage.setItem('adminReplyEngine', $('engine').value);
    } catch (e) {}

    var btn = $('go');
    btn.disabled = true;
    btn.textContent = '작성 중… (10~30초)';
    try {
      var res = await fetch('/api/admin/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
        body: JSON.stringify({
          message: $('message').value,
          wechat: $('wechat').value.trim(),
          caseId: $('caseId').value.trim(),
          engine: $('engine').value
        })
      });
      var data = await res.json().catch(function () { return { error: '서버 응답을 읽을 수 없습니다 (' + res.status + ')' }; });
      if (!res.ok || data.error) throw new Error(data.error || res.status);

      var d = data.draft;
      var found = Object.keys(data.records || {}).reduce(function (n, k) { return n + (data.records[k] || []).length; }, 0);
      $('meta').innerHTML = '';
      [CATEGORY[d.category] || d.category,
       found ? '시트 ' + found + '건 찾음' : '시트 기록 없음',
       d.matched_case,
       data.engine === 'gemini' ? 'Gemini' : 'Claude'
      ].forEach(function (t) {
        if (!t) return;
        var s = document.createElement('span');
        s.className = 'badge';
        s.textContent = t;
        $('meta').appendChild(s);
      });
      $('replyZh').value = d.reply_zh;
      $('replyKo').textContent = d.reply_ko;
      $('notes').textContent = d.notes;
      $('notesWrap').hidden = !d.notes;
      $('records').textContent = JSON.stringify(data.records, null, 2);
      $('result').hidden = false;
      $('result').scrollIntoView({ behavior: 'smooth' });
    } catch (e) {
      showError(e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '답변 초안 만들기';
    }
  });

  $('copy').addEventListener('click', async function () {
    var text = $('replyZh').value;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      $('replyZh').select();
      document.execCommand('copy');
    }
    this.textContent = '✅ 복사됨 — 위챗에 붙여넣기';
    var btn = this;
    setTimeout(function () { btn.textContent = '📋 복사하기'; }, 2000);
  });
})();
</script>
</body>
</html>
